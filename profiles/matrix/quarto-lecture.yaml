# Purpose: Generate quarto profile variants
# Quarto lecture environments with different focuses

features:
  - bundle-base-full
  - bundle-dev-base
  - bundle-data-science
options:
  INSTALL_NOTEBOOK_EXTENSIONS: true
matrix:
  quarto:
    features:
      - bundle-quarto-base
    options: {}
  quarto-full:
    features:
      - bundle-quarto-full
      - homebrew
      - stow
      - quarto-chromium
      - bundle-java-build
      - java-jdk
      - java-maven
      - java-gradle
      - java-kernel
      - bundle-container-dev
      - postgresql-client
      - bundle-k8s
      - bundle-container-runtimes
      - dive
      - trivy
      - hadolint
      - skopeo
      - ctop
    options:
      JDK_VERSION: 25
    services:
      - dind
      - postgres:version=16
  quarto-db-pg:
    features:
      - bundle-quarto-base
      - postgresql-client
      - bundle-python-db
    services:
      - postgres:version=16
  quarto-containers:
    features:
      - bundle-quarto-full
      - quarto-chromium
      - bundle-java-build
      - java-jdk
      - bundle-container-runtimes
      - bundle-container-dev
      - postgresql-client
      - bundle-python-db
      - container-init
    options:
      JDK_VERSION: 25
      ENABLEBUILDKIT: true
      STORAGEDRIVER: overlay2
    services:
      - dind
      - postgres:version=16

  # Java-focused variants (moved from quarto-dev-java.yaml)
  quarto-java-ea:
    features:
      - bundle-quarto-base
      - java-jdk
      - java-maven
      - java-gradle
      - java-kernel
    options:
      KERNEL_VERSION: v1.4.5
      ARTIFACTS_BASE_URL: https://github.com/ebpro/IJava/releases
      JDK_VERSION: ea

  quarto-java-25:
    features:
      - bundle-quarto-base
      - java-jdk
      - java-maven
      - java-gradle
      - java-kernel
    options:
      KERNEL_VERSION: v1.4.5
      ARTIFACTS_BASE_URL: https://github.com/ebpro/IJava/releases
      JDK_VERSION: 25
