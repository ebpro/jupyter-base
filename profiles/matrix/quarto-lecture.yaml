# Purpose: Generate quarto-lecture profile variants
# Quarto lecture environments with different focuses

features:
  - bundle-base-full
  - bundle-dev-base
  - bundle-data-science
options:
  INSTALL_NOTEBOOK_EXTENSIONS: true
matrix:
  quarto-lecture:
    features:
      - bundle-quarto-base
    options: {}
  quarto-lecture-full:
    features:
      - bundle-quarto-full
      - quarto-chromium
      - bundle-java-build
      - java-jdk
      - java-kernel
      - bundle-k8s
      - bundle-container-runtimes
      - postgresql-client-cli
      - python-db-dev
      - typescript
      - react-tools
      - ml-python-packages
    services:
      - dind
      - k3s
  quarto-lecture-db:
    features:
      - bundle-quarto-base
      - postgresql-client
      - python-db-dev
    services:
      - postgres:version=16
  quarto-lecture-containers:
    features:
      - bundle-quarto-full
      - quarto-chromium
      - bundle-java-build
      - java-jdk
      - bundle-container-runtimes
      - postgresql-client
      - python-db-dev
      - startup
      - java-kernel
    options:
      JDK_VERSION: 25
      ENABLEBUILDKIT: true
      STORAGEDRIVER: overlay2
    services:
      - dind
      - postgres:version=16
