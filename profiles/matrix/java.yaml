# Purpose: Generate Java profile variants
# Java development with different versions, GraalVM, and database options

features:
  - bundle-base-full
  - bundle-dev-base
  - bundle-java-build
options: {}
matrix:
  java-db-jdk25:
    features:
      - bundle-java-db
      - java-jdk
    options:
      JDK_VERSION: 25
    services:
      - postgres:version=16
  java-graal:
    features:
      - graalvm
    options:
      GRAALVM_VERSION: 22.3.1
