# Purpose: Generate language-specific profile variants
# Kotlin, web development, and other language stacks

features:
  - bundle-base-full
  - bundle-dev-base
options: {}
matrix:
  lang-kotlin:
    features:
      - bundle-java-build
      - java-jdk
      - kotlin
    options:
      INSTALL_KOTLIN: true
      # features/kotlin/install.sh installs the pinned kotlin-jupyter-kernel
      # wheel (checksums.json tools.kotlin-jupyter) behind this gate: build-time
      # ~80 MB verified download, kernelspec at <prefix>/share/jupyter/kernels/
      # kotlin. The language level follows the kernel release, not KOTLIN_VERSION.
      # See features/kotlin/README.md before changing the pin.
      INSTALL_KOTLIN_KERNEL: true
      # java-jdk supplies the JVM the kotlin kernel launches and that
      # java-maven/java-gradle need; java-sdkman alone installs only the
      # SDKMAN shell (no candidates/java). JDK_VERSION mirrors the java-jdk
      # feature default and lang-java-db-jdk25 (the non-self-named sibling).
      JDK_VERSION: 25
  lang-web-dev:
    features:
      - bundle-web-dev
    options: {}
  # Java language variants (merged from java-dev.yaml, java-sdk.yaml, java.yaml)
  lang-java-latest:
    features:
      - bundle-java-build
      - java-jdk
    options:
      JDK_VERSION: latest

  lang-java-ea:
    features:
      - bundle-java-build
      - java-jdk
    options:
      JDK_VERSION: ea

  lang-java-8:
    features:
      - bundle-java-build
      - java-jdk
    options:
      JDK_VERSION: 8

  lang-java-21:
    features:
      - bundle-java-build
      - java-jdk
    options:
      JDK_VERSION: 21

  lang-java-25:
    features:
      - bundle-java-build
      - java-jdk
    options:
      JDK_VERSION: 25

  lang-java-sdk:
    features:
      - bundle-java-build
      # java-jdk is required for a real JDK: bundle-java-build's java-sdkman
      # installs only the SDKMAN shell, leaving mvn/gradle without a JVM.
      - java-jdk
    options:
      JDK_VERSION: 25

  lang-java-db-jdk25:
    features:
      - java-db-dev
      - java-jdk
    options:
      JDK_VERSION: 25
    services:
      - postgres:version=16

  lang-java-graal:
    features:
      - graalvm
    options:
      GRAALVM_VERSION: 25.4.4.1+1-graalce
