# Purpose: Generate Kubernetes development profile variants
# Kubernetes development with kubectl, kind, tilt, and optional podman/k3s

features:
  - bundle-base-full
  - bundle-dev-base
  - bundle-k8s
matrix:
  k8s-dev:
    options: {}
  k8s-sim:
    features:
      - podman
    services:
      - k3s:version=v1.31-latest
      - registry
