# Purpose: Generate Java development profiles with different JDK versions
# Matrix expands to: java-latest, java-ea, java-8, java-21, java-25

features:
  - bundle-base-full
  - bundle-dev-base
  - bundle-java-build
  - java-jdk
matrix:
  java-latest:
    options:
      JDK_VERSION: latest
  java-ea:
    options:
      JDK_VERSION: ea
  java-8:
    options:
      JDK_VERSION: 8
  java-21:
    options:
      JDK_VERSION: 21
  java-25:
    options:
      JDK_VERSION: 25
