name: Release Images, Promote & Sign

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      REPO: ghcr.io/${{ github.repository_owner }}
      IMAGE_NAME: ${{ github.event.repository.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure build script is executable
        run: chmod +x ./build.sh

      - name: Build and push all profiles
        run: |
          set -euo pipefail
          rm -f digests.csv || true
          for p in profiles/*; do
            profile=$(basename "$p")
            echo "Building profile: $profile"
            # build.sh will generate image-digest.txt when possible
            ./build.sh --profile "$profile" --push
            if [ -f image-digest.txt ]; then
              digest=$(cat image-digest.txt)
            else
              # try to discover digest from the registry using the canonical tag
              profile_slug=$(echo "$profile" | sed -E 's/^[0-9]+(-[0-9]+)*-//')
              shortsha=$(git rev-parse --short HEAD || echo 'nogit')
              tag="${profile_slug}-${shortsha}"
              digest=$(docker buildx imagetools inspect ${REPO}/${IMAGE_NAME}:${tag} --raw 2>/dev/null | jq -r '.manifests[0].digest' || true)
            fi
            echo "$profile,$digest" >> digests.csv
          done

      - name: Prepare cosign key
        if: ${{ secrets.COSIGN_PRIVATE_KEY != '' }}
        run: |
          echo "Decoding COSIGN_PRIVATE_KEY..."
          echo "${{ secrets.COSIGN_PRIVATE_KEY }}" | base64 --decode > cosign.key
          chmod 600 cosign.key

      - name: Promote images by digest and sign
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          version=${GITHUB_REF#refs/tags/}
          while IFS=',' read -r profile digest; do
            echo "Promoting $profile -> $digest"
            profile_slug=$(echo "$profile" | sed -E 's/^[0-9]+(-[0-9]+)*-//')
            promoted_tag="${profile_slug}-v${version}"
            # Create a new tag in the registry that points to the pushed digest
            docker buildx imagetools create --tag ${REPO}/${IMAGE_NAME}:${promoted_tag} ${REPO}/${IMAGE_NAME}@${digest}
            # Sign the promoted tag with cosign if key available
            if [ -f cosign.key ]; then
              echo "Signing ${REPO}/${IMAGE_NAME}:${promoted_tag}"
              # Use cosign to sign the image tag
              COSIGN_PASSWORD="${COSIGN_PASSWORD}" cosign sign --key cosign.key ${REPO}/${IMAGE_NAME}:${promoted_tag}
            else
              echo "cosign key not available; skipping signing for ${promoted_tag}"
            fi
          done < digests.csv

      - name: Upload digests artifact
        uses: actions/upload-artifact@v4
        with:
          name: promoted-digests
          path: digests.csv
