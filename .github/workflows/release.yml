name: Release Images, Promote & Sign

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ebpro-org
    env:
      REPO: ghcr.io/${{ github.repository_owner }}
      IMAGE_NAME: ${{ github.event.repository.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install solen-cli
        run: |
          python -m pip install --upgrade pip
          pip install -e solen-cli

      - name: Generate profiles
        run: solen generate profiles --matrix profiles/matrix --out generated/profiles --chain

      - name: Register QEMU emulators for multi-arch
        run: docker run --rm --privileged tonistiigi/binfmt:latest --install

      - name: Create multi-arch buildx builder
        run: docker buildx create --name multiarch --driver docker-container --use

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push all profiles (multi-arch)
        run: |
          set -euo pipefail
          shortsha=$(git rev-parse --short HEAD)
          : > digests.csv
          while IFS= read -r profile; do
            [ -n "$profile" ] || continue
            echo "Building profile: $profile"
            ./build.sh "$profile" --push --multi-arch
            # Manifest-list digest as pushed (canonical <slug>-<sha> tag)
            profile_slug=$(echo "$profile" | sed -E 's/^[0-9]+(-[0-9]+)*-//')
            ref="${REPO}/${IMAGE_NAME}:${profile_slug}-${shortsha}"
            digest=$(docker buildx imagetools inspect "$ref" | awk '/^Digest:/{print $2}')
            if [ -z "$digest" ]; then
              echo "ERROR: could not resolve digest for $ref" >&2
              exit 1
            fi
            echo "$profile,$digest" >> digests.csv
          done < <(solen list profiles)

      - name: Prepare cosign key
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.COSIGN_PRIVATE_KEY }}" ]; then
            echo "Decoding COSIGN_PRIVATE_KEY..."
            echo "${{ secrets.COSIGN_PRIVATE_KEY }}" | base64 --decode > cosign.key
            chmod 600 cosign.key
          else
            echo "COSIGN_PRIVATE_KEY not set; signing will be skipped"
          fi

      - name: Promote images by digest and sign
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          version=${GITHUB_REF#refs/tags/}
          while IFS=',' read -r profile digest; do
            echo "Promoting $profile -> $digest"
            profile_slug=$(echo "$profile" | sed -E 's/^[0-9]+(-[0-9]+)*-//')
            promoted_tag="${profile_slug}-v${version}"
            # Create a new tag in the registry that points to the pushed digest
            docker buildx imagetools create --tag ${REPO}/${IMAGE_NAME}:${promoted_tag} ${REPO}/${IMAGE_NAME}@${digest}
            # Sign the promoted tag with cosign if key available
            if [ -f cosign.key ]; then
              echo "Signing ${REPO}/${IMAGE_NAME}:${promoted_tag}"
              COSIGN_PASSWORD="${COSIGN_PASSWORD}" cosign sign --key cosign.key ${REPO}/${IMAGE_NAME}:${promoted_tag}
            else
              echo "cosign key not available; skipping signing for ${promoted_tag}"
            fi
          done < digests.csv

      - name: Upload digests artifact
        uses: actions/upload-artifact@v4
        with:
          name: promoted-digests
          path: digests.csv
