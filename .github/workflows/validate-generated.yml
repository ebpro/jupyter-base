name: Validate Generated Files

on:
  pull_request:
    paths:
      - 'profiles/**'
      - '.devcontainer/features/**'
      - 'scripts/generate-*.py'
      - 'scripts/generate-*.sh'
      - 'devcontainer/service-templates/**'
  push:
    branches:
      - main
      - develop

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Regenerate all files
        run: |
          ./scripts/generate-all-matrix-profiles.sh
          ./scripts/generate-all-devcontainers.sh
          ./scripts/generate-dockerfile.sh --all-profiles --out Dockerfile.generated

      - name: Check for uncommitted changes
        run: |
          git diff --exit-code generated/ Dockerfile.generated || {
            echo "❌ Generated files are out of date!"
            echo ""
            echo "Changed files:"
            git diff --name-only generated/ Dockerfile.generated
            echo ""
            echo "Run locally:"
            echo "  ./scripts/validate-generated-files.sh"
            echo ""
            exit 1
          }

      - name: Validate feature dependencies
        run: |
          if [ -f scripts/validate-feature-deps.py ]; then
            python3 scripts/validate-feature-deps.py
          fi

      - name: Summary
        if: success()
        run: |
          echo "✅ All generated files are up-to-date"
          echo ""
          echo "Generated profiles: $(ls -1 generated/profiles | wc -l)"
          echo "Generated devcontainers: $(ls -1 generated/devcontainer | wc -l)"
