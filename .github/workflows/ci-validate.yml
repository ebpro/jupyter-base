name: CI Validate

on:
  push:
    branches: [ main, develop ]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install solen-cli with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e solen-cli[dev]

      - name: Validate features
        run: solen validate features

      - name: Generate profiles
        run: solen generate profiles --matrix profiles/matrix --out generated/profiles --chain

      - name: Generate devcontainers
        run: solen generate devcontainer --all

      - name: Check versions in sync
        run: solen versions sync --check

      - name: Run test suite with coverage
        run: python -m pytest tests/ -q --cov=solen --cov-report=xml:coverage.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 1

      - name: Lint
        run: ruff check solen-cli tests
