name: CI Validate

on:
  push:
    branches: [ main, develop ]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Regression-anchor tests (tests/test_*_is_mirrored.py, red-proof suites)
          # resolve historical commits via `git show` / `rev-parse` /
          # `merge-base --is-ancestor`. The default fetch-depth: 1 leaves those
          # objects unreachable (exit 128). The oldest anchor actually used in a
          # git command is 7000760 (= de086cb^, 50 commits behind develop); 100
          # leaves 2x headroom while staying far cheaper than full history
          # (339 commits, ~100 MiB pack). If a future test pins an older commit,
          # raise this value — do NOT convert the anchors to skips.
          fetch-depth: 100

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install solen-cli with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e solen-cli[dev]

      - name: Validate features
        run: solen validate features

      - name: Generate profiles
        run: solen generate profiles --matrix profiles/matrix --out generated/profiles --chain

      - name: Generate devcontainers
        run: solen generate devcontainer --all

      - name: Check versions in sync
        run: solen versions sync --check

      - name: Run test suite with coverage
        run: python -m pytest tests/ solen-cli/tests -q --cov=solen --cov-report=xml:coverage.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 1

      - name: Lint
        run: ruff check solen-cli tests
