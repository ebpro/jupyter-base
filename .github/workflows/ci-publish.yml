      # Harbor is a SOFT dependency: the registry build cache only makes builds
      # faster, the GHCR push is the product. Probe it BEFORE logging in so an
      # outage is classified as such and never mistaken for a bad credential.
      # No secret is referenced, printed or passed by this step: it is an
      # unauthenticated GET /v2/ only.
      - name: Pre-flight Harbor probe (cache availability, no credentials)
        id: harbor
        continue-on-error: true
        run: |
          set -uo pipefail
          url="https://harbor.ebruno.fr/v2/"
          if [ -z "${HARBOR_USERNAME:-}" ]; then
            echo "harbor_ready=false" >> "$GITHUB_OUTPUT"
            echo "Harbor credentials are not configured for this runner scope; building without the registry cache."
            echo "::warning::HARBOR_USERNAME/HARBOR_ROBOT_SECRET are absent in this scope, so the Harbor build cache is skipped. This is a cache-availability issue, NOT a credential failure, and is NOT a reason to rotate HARBOR_ROBOT_SECRET."
            exit 0
          fi
          body="$(mktemp)"
          # No -f: a 401 must be readable as a status code, not swallowed as an
          # error. Registry v2 answers 401 (Bearer challenge) when HEALTHY, so
          # 200/401 => alive; timeout/000/5xx/DNS error => outage.
          code="$(curl -sS -o "$body" -m 10 -w '%{http_code}' "$url" 2>/dev/null || true)"
          [ -n "$code" ] || code="000"
          echo "Probe: GET $url (unauthenticated) -> HTTP $code"
          echo "Response body (first 400 bytes):"
          head -c 400 "$body"
          echo ""
          rm -f "$body"
          case "$code" in
            200|401)
              echo "harbor_ready=true" >> "$GITHUB_OUTPUT"
              echo "Harbor answered HTTP $code: the registry is alive ($code is the healthy Registry v2 challenge) and the cache stays enabled."
              ;;
            *)
              echo "harbor_ready=false" >> "$GITHUB_OUTPUT"
              echo "Harbor unreachable (HTTP $code); falling back to a cache-less build."
              echo "::warning::Harbor ($url) is UNREACHABLE (HTTP $code) — this is a cache-registry AVAILABILITY problem (outage, disk full, DNS or timeout), NOT a credential problem. Do NOT rotate HARBOR_ROBOT_SECRET. The build proceeds without the registry cache, so it is slower but the GHCR push is unaffected."
              ;;
          esac

      # Skipped when the probe saw an outage, and non-fatal when it fails: a
      # login-stage token death (attempt 2's shape) must not fail the job. Its
      # outcome feeds HARBOR_READY in the build step, which drops BOTH cache
      # directives on the floor when the cache cannot be trusted.
      - name: Login to Harbor (build cache)
        id: harbor-login
        if: steps.harbor.outputs.harbor_ready == 'true'
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: harbor.ebruno.fr
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_ROBOT_SECRET }}

      - name: Build and push (arm64, all)
        env:
          PROFILE_LIST: ${{ github.event.inputs.profiles || '' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          # Harbor is ready only when the unauthenticated probe saw it alive
          # AND the login step did not fail. Derived from step outputs (never
          # the `secrets` context) so Actions evaluates it reliably.
          HARBOR_READY: ${{ steps.harbor.outputs.harbor_ready == 'true' && steps.harbor-login.outcome != 'failure' }}
        run: |
          set -euo pipefail
          # Heavy = quarto-full + every lang-java-* / quarto-java-* profile.
          is_heavy() {
            case "$1" in
              quarto-full|lang-java-*|quarto-java-*) return 0 ;;
              *) return 1 ;;
            esac
          }
          if [ -n "$PROFILE_LIST" ]; then
            IFS=',' read -r -a arr <<< "$PROFILE_LIST"
          else
            arr=()
            for f in generated/profiles/*; do
              [ -f "$f" ] && arr+=("$(basename "$f")")
            done
          fi
          filtered=()
          for p in "${arr[@]}"; do
            p=$(echo "$p" | xargs)
            [ -n "$p" ] || continue
            case "$SUBSET" in
              all)      filtered+=("$p") ;;
              heavy)    if is_heavy "$p"; then filtered+=("$p"); fi ;;
              standard) if ! is_heavy "$p"; then filtered+=("$p"); fi ;;
            esac
          done
          echo "Subset '$SUBSET' on $ARCH -> ${#filtered[@]} profile(s)"
          if [ "${#filtered[@]}" -eq 0 ]; then
            echo "Nothing to build for this job; skipping."
            exit 0
          fi
          # Cache posture, decided once per job and never fatal. With Harbor
          # trusted, use the bake produced by the validated Generate step,
          # untouched. Otherwise generate a SEPARATE cache-less bake with
          # --no-cache, which omits BOTH cache-from and cache-to: --no-cache-to
          # deliberately keeps cache-from and therefore cannot recover an
          # importer-side 401/connection failure. Cost of the fallback is a
          # cold build, never a failed publish.
          if [ "$HARBOR_READY" = "true" ]; then
            BAKE_FILE=generated/docker-bake.hcl
          else
            echo "Harbor unavailable; building without any registry cache (slower, by design)." >&2
            # Word-split the flag string through a quoted herestring read rather
            # than an unquoted expansion, so no new shellcheck/SC2086 finding is
            # added to the actionlint baseline.
            read -r -a nocache_bake_args <<< "$BAKE_FLAGS"
            solen generate bake --no-cache --output generated/docker-bake-nocache.hcl --repo "$IMAGE_REPO" --image-name "$IMAGE_NAME" "${nocache_bake_args[@]}"
            BAKE_FILE=generated/docker-bake-nocache.hcl
          fi
          for profile in "${filtered[@]}"; do
            echo "Publishing profile: $profile (arch: $ARCH)"
            # The Harbor registry cache (cache-from + cache-to) is carried by
            # the generated bake file (--harbor-cache in the Generate step).
            # The cache-to export is best-effort: Harbor answers 499 (Client
            # Closed Request) on large layer uploads (e.g. quarto-containers),
            # which must not fail the build — the GHCR push is what matters.
            # On failure: regenerate the bake WITHOUT cache-to (cache-from is
            # kept) into a distinct file (generated/docker-bake-retry.hcl) and
            # retry once; the retry's exit code is propagated, so a GHCR push
            # failure still fails the build. The main bake file is never
            # rewritten, so remaining profiles keep the cache-to export.
            if docker buildx bake --file "$BAKE_FILE" "final-$profile" \
              --set "*.args.SSH_PRIVATE_KEY=${SSH_PRIVATE_KEY}" \
              --push; then
              echo "Build/push succeeded for $profile"
              continue
            fi
            # The retry below exists only for the Harbor 499-on-large-layer
            # cache-to case and still reads the Harbor cache (cache-from).
            # When Harbor was already excluded there is nothing left to drop,
            # so fail with an accurate reason instead of retrying against a
            # registry known to be unreachable.
            if [ "$HARBOR_READY" != "true" ]; then
              echo "ERROR: build failed for $profile on the cache-less bake; the Harbor cache is already excluded, so there is no further retry to make" >&2
              exit 1
            fi
            echo "WARN: build failed for $profile (likely 499 on the Harbor cache-to export for a large layer); regenerating bake WITHOUT cache-to and retrying" >&2
            solen generate bake --no-cache-to --output generated/docker-bake-retry.hcl --repo "$IMAGE_REPO" --image-name "$IMAGE_NAME" $BAKE_FLAGS --harbor-cache harbor.ebruno.fr/solen/build-cache
            docker buildx bake --file generated/docker-bake-retry.hcl "final-$profile" \
              --set "*.args.SSH_PRIVATE_KEY=${SSH_PRIVATE_KEY}" \
              --push
          done

  # Post-build OCI index merge: for each base tag T in the (no-suffix) bake,
  # fold the per-arch images into a multi-arch index at T.
  merge-index:
    runs-on: ebpro-org
    needs: [build-amd64-heavy, build-amd64-standard, build-arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install solen-cli
        run: |
          python -m pip install --upgrade pip
          pip install -e solen-cli

      - name: Generate profiles
        run: |
          solen generate profiles --matrix profiles/matrix --out generated/profiles --chain

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate base bake (no suffix, no build tag)
        run: |
          solen generate bake --output generated/docker-bake.hcl --repo "$IMAGE_REPO" --image-name "$IMAGE_NAME" --no-build-tag

      - name: Merge per-arch images into the OCI index
        env:
          PROFILE_LIST: ${{ github.event.inputs.profiles || '' }}
        run: |
          set -euo pipefail
          # Human-friendly slug: strip leading numeric prefixes (digits-digits- or
          # digits-), mirroring solen.generators.bake.compute_profile_slug.
          compute_slug() {
            local p="$1"
            if [[ "$p" =~ ^[0-9]+- ]]; then p="${p#*-}"; fi
            if [[ "$p" =~ ^[0-9]+- ]]; then p="${p#*-}"; fi
            echo "$p"
          }
          # Print one line per CONCRETE architecture in the manifest (list)
          # at $1. `docker buildx imagetools inspect --raw` fetches only the
          # manifest JSON — no image pull, no --platform resolution — using
          # the same buildx plugin the fold below already depends on.
          # python3 comes from the setup-python step above. Entries with
          # architecture "unknown" (provenance/SBOM attestations legally
          # present in an OCI index) are ignored, never counted as a
          # mismatch. Any inspection or JSON-parse failure exits non-zero
          # so the caller's `if !` sees it (pipefail-compatible, nothing
          # swallowed).
          # NOTE: the python lines below are indented to the YAML block
          # scalar's base column (10); YAML strips exactly that prefix, so
          # python receives column-0 top-level statements. Do not reindent.
          manifest_arches() {
            docker buildx imagetools inspect --raw "$1" | python3 -c '
          import json, sys
          try:
              m = json.load(sys.stdin)
          except Exception as exc:
              print("unparseable manifest JSON: " + str(exc), file=sys.stderr)
              sys.exit(1)
          entries = m.get("manifests")
          if entries is None:
              entries = [m]
          for e in entries:
              plat = e.get("platform") or {}
              arch = plat.get("architecture") or e.get("architecture") or ""
              if arch and arch != "unknown":
                  print(arch)
          '
          }
          # If a profile subset was requested (workflow_dispatch), only fold those
          # profiles' indexes. Empty PROFILE_LIST (v* tag / no input) = fold all.
          req_slugs=()
          if [ -n "$PROFILE_LIST" ]; then
            IFS=',' read -r -a _req <<< "$PROFILE_LIST"
            for p in "${_req[@]}"; do
              p=$(echo "$p" | xargs)
              if [ -z "$p" ]; then continue; fi
              req_slugs+=("$(compute_slug "$p")")
            done
          fi
          # All known profile slugs (same authoritative generated/profiles list
          # the build jobs use), mapped through compute_slug and deduplicated.
          # Used below to resolve which slug OWNS a candidate tag.
          mapfile -t all_slugs < <(
            for f in generated/profiles/*; do
              [ -f "$f" ] && compute_slug "$(basename "$f")"
            done | sort -u
          )
          for T in $(grep -oE 'ghcr.io/[^"]+' generated/docker-bake.hcl | sort -u); do
            # Skip the bare repo ref from the generated header comment (no tag).
            if [[ "$T" != *:* ]]; then continue; fi
            if [ "${#req_slugs[@]}" -gt 0 ]; then
              # Exact-slug ownership: a tag belongs to the LONGEST known slug
              # it equals or starts with "<slug>-". A plain prefix glob over
              # the requested slugs would also fold sibling profiles (e.g.
              # requesting "quarto" would re-fold "quarto-full-*" indexes that
              # this run never built, mixing arch layers from different
              # commits via stale per-arch tags). Only fold tags whose OWNING
              # slug was requested.
              tag=${T#*:}
              owner=""
              for s in "${all_slugs[@]}"; do
                if [[ "$tag" == "$s" || "$tag" == "$s"-* ]] && [ "${#s}" -gt "${#owner}" ]; then
                  owner="$s"
                fi
              done
              if [ -z "$owner" ]; then continue; fi
              match=0
              for s in "${req_slugs[@]}"; do
                if [ "$s" = "$owner" ]; then match=1; break; fi
              done
              if [ "$match" -ne 1 ]; then continue; fi
            fi
            # Fold-time architecture assertion: every per-arch source tag must
            # contain an image manifest of the architecture its suffix
            # declares. The builders tag host-arch output (bake pins
            # platforms=[host] and `--tag-suffix <arch>` is a pure string), so
            # a mis-scheduled build silently produces e.g. an -amd64 tag
            # holding arm64 images. Catch it HERE, before imagetools create,
            # instead of publishing a corrupt index. Expected arch is derived
            # from the same suffix literals the fold uses below. Manifest-only
            # inspection (`inspect --raw`): no pulls, no downloads.
            for expected in amd64 arm64; do
              src="${T}-${expected}"
              if ! found=$(manifest_arches "$src"); then
                echo "::error:: Architecture assertion failed: could not inspect the manifest of source tag ${src} (expected '-${expected}' content). Refusing to fold ${T}" >&2
                exit 1
              fi
              if [ -z "$found" ]; then
                echo "::error:: Architecture assertion failed: source tag ${src} contains no concrete image manifest (only attestations or empty index). Refusing to fold ${T}" >&2
                exit 1
              fi
              for a in $found; do
                if [ "$a" != "$expected" ]; then
                  echo "::error:: Architecture assertion failed: source tag ${src} contains architecture ${a} but its '-${expected}' suffix declares ${expected}. Refusing to fold ${T} — check which runner (arch) served the build job for ${src}" >&2
                  exit 1
                fi
              done
            done
            echo "Merging OCI index: $T  <-  ${T}-amd64, ${T}-arm64"
            docker buildx imagetools create -t "$T" "${T}-amd64" "${T}-arm64"
          done

  # Post-merge signing: consume the native `solen` OCI index produced by
  # `merge-index` and sign the release tag with cosign. Release-only (v* tags):
  # no QEMU/binfmt, no buildx builder, no imagetools promotion — the index
  # already exists at <slug>-v<version> (single `v`, no double-`v` bug).
  sign-release:
    name: Sign release (solen index)
    needs: [merge-index]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ebpro-org
    env:
      REPO: ghcr.io/${{ github.repository_owner }}
      IMAGE_NAME: solen
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install solen-cli
        run: pip install -e solen-cli
      - name: Generate profiles
        run: solen generate profiles --matrix profiles/matrix --out generated/profiles --chain
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare cosign key
        run: |
          if [ -n "${{ secrets.COSIGN_PRIVATE_KEY }}" ]; then
            echo "${{ secrets.COSIGN_PRIVATE_KEY }}" | base64 -d > cosign.key
            chmod 600 cosign.key
          fi
      - name: Sign solen release indexes
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          version=${GITHUB_REF#refs/tags/v}
          for profile in $(solen list profiles); do
            profile_slug=$(echo "$profile" | sed -E 's/^[0-9]+(-[0-9]+)*-//')
            sign_tag="${profile_slug}-v${version}"
            ref="${REPO}/${IMAGE_NAME}:${sign_tag}"
            if [ -f cosign.key ]; then
              echo "Signing ${ref}"
              COSIGN_PASSWORD="${COSIGN_PASSWORD}" cosign sign --key cosign.key "${ref}"
            else
              echo "No cosign key present, skipping signing for ${ref}"
            fi
          done
