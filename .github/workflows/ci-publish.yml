            echo "Nothing to build for this job; skipping."
            exit 0
          fi
          for profile in "${filtered[@]}"; do
            echo "Publishing profile: $profile (arch: $ARCH)"
            docker buildx bake --file generated/docker-bake.hcl "final-$profile" \
              --set "*.cache-from=type=registry,ref=harbor.ebruno.fr/solen/build-cache:${profile}-${ARCH},mode=max" \
              --set "*.cache-to=type=registry,ref=harbor.ebruno.fr/solen/build-cache:${profile}-${ARCH},mode=max" \
              --push
          done

  # Native arm64 build of ALL profiles. v* only: the develop fast path is
  # amd64-only (no merge, no arm64).
  build-arm64:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: ebpro-org-arm
    env:
      IS_VTAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
      ARCH: arm64
      SUBSET: all
      BAKE_FLAGS: "${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && '--tag-suffix arm64 --no-build-tag' || '' }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install solen-cli
        run: |
          python -m pip install --upgrade pip
