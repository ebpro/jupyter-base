            fi
            # Second escalation, for the shape a pre-flight probe cannot see:
            # the cache registry dies or its token expires MID-build, after a
            # healthy probe and login (attempt 2: login 01:38Z, importer and
            # exporter 401 at 02:37Z). --no-cache-to still imports from Harbor
            # so it cannot recover that case; --no-cache drops both
            # directives. If the cache-less build also fails, the fault is the
            # build or the GHCR push and the exit code propagates.
            echo "WARN: cache-to-less retry also failed for $profile; Harbor cache appears unusable mid-build; retrying fully cache-less" >&2
            echo "::warning::The Harbor build cache failed mid-build for profile $profile even though the pre-flight probe and login were healthy. That is a cache-registry availability or robot-token lifetime problem, NOT a bad secret; do not rotate HARBOR_ROBOT_SECRET. Retrying without any registry cache."
            read -r -a cold_bake_args <<< "$BAKE_FLAGS"
            solen generate bake --no-cache --output generated/docker-bake-nocache.hcl --repo "$IMAGE_REPO" --image-name "$IMAGE_NAME" "${cold_bake_args[@]}"
            docker buildx bake --file generated/docker-bake-nocache.hcl "final-$profile" \
              --set "*.args.SSH_PRIVATE_KEY=${SSH_PRIVATE_KEY}" \
              --push
          done

  # Post-build OCI index merge: for each base tag T in the (no-suffix) bake,
  # fold the per-arch images into a multi-arch index at T.
  merge-index:
    runs-on: ebpro-org
    needs: [build-amd64-heavy, build-amd64-standard, build-arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install solen-cli
        run: |
          python -m pip install --upgrade pip
          pip install -e solen-cli

      - name: Generate profiles
        run: |
          solen generate profiles --matrix profiles/matrix --out generated/profiles --chain

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate base bake (no suffix, no build tag)
        run: |
          solen generate bake --output generated/docker-bake.hcl --repo "$IMAGE_REPO" --image-name "$IMAGE_NAME" --no-build-tag

      - name: Merge per-arch images into the OCI index
        env:
          PROFILE_LIST: ${{ github.event.inputs.profiles || '' }}
        run: |
          set -euo pipefail
          # Human-friendly slug: strip leading numeric prefixes (digits-digits- or
          # digits-), mirroring solen.generators.bake.compute_profile_slug.
          compute_slug() {
            local p="$1"
            if [[ "$p" =~ ^[0-9]+- ]]; then p="${p#*-}"; fi
            if [[ "$p" =~ ^[0-9]+- ]]; then p="${p#*-}"; fi
            echo "$p"
          }
          # Print one line per CONCRETE architecture in the manifest (list)
          # at $1. `docker buildx imagetools inspect --raw` fetches only the
          # manifest JSON — no image pull, no --platform resolution — using
          # the same buildx plugin the fold below already depends on.
          # python3 comes from the setup-python step above. Entries with
          # architecture "unknown" (provenance/SBOM attestations legally
          # present in an OCI index) are ignored, never counted as a
          # mismatch. Any inspection or JSON-parse failure exits non-zero
          # so the caller's `if !` sees it (pipefail-compatible, nothing
          # swallowed).
          # NOTE: the python lines below are indented to the YAML block
          # scalar's base column (10); YAML strips exactly that prefix, so
          # python receives column-0 top-level statements. Do not reindent.
          manifest_arches() {
            docker buildx imagetools inspect --raw "$1" | python3 -c '
          import json, sys
          try:
              m = json.load(sys.stdin)
          except Exception as exc:
              print("unparseable manifest JSON: " + str(exc), file=sys.stderr)
              sys.exit(1)
          entries = m.get("manifests")
          if entries is None:
              entries = [m]
          for e in entries:
              plat = e.get("platform") or {}
              arch = plat.get("architecture") or e.get("architecture") or ""
              if arch and arch != "unknown":
                  print(arch)
          '
          }
          # If a profile subset was requested (workflow_dispatch), only fold those
          # profiles' indexes. Empty PROFILE_LIST (v* tag / no input) = fold all.
          req_slugs=()
          if [ -n "$PROFILE_LIST" ]; then
            IFS=',' read -r -a _req <<< "$PROFILE_LIST"
            for p in "${_req[@]}"; do
              p=$(echo "$p" | xargs)
              if [ -z "$p" ]; then continue; fi
              req_slugs+=("$(compute_slug "$p")")
            done
          fi
          # All known profile slugs (same authoritative generated/profiles list
          # the build jobs use), mapped through compute_slug and deduplicated.
          # Used below to resolve which slug OWNS a candidate tag.
          mapfile -t all_slugs < <(
            for f in generated/profiles/*; do
              [ -f "$f" ] && compute_slug "$(basename "$f")"
            done | sort -u
          )
          for T in $(grep -oE 'ghcr.io/[^"]+' generated/docker-bake.hcl | sort -u); do
            # Skip the bare repo ref from the generated header comment (no tag).
            if [[ "$T" != *:* ]]; then continue; fi
            if [ "${#req_slugs[@]}" -gt 0 ]; then
              # Exact-slug ownership: a tag belongs to the LONGEST known slug
              # it equals or starts with "<slug>-". A plain prefix glob over
              # the requested slugs would also fold sibling profiles (e.g.
              # requesting "quarto" would re-fold "quarto-full-*" indexes that
              # this run never built, mixing arch layers from different
              # commits via stale per-arch tags). Only fold tags whose OWNING
              # slug was requested.
              tag=${T#*:}
              owner=""
              for s in "${all_slugs[@]}"; do
                if [[ "$tag" == "$s" || "$tag" == "$s"-* ]] && [ "${#s}" -gt "${#owner}" ]; then
                  owner="$s"
                fi
              done
              if [ -z "$owner" ]; then continue; fi
              match=0
              for s in "${req_slugs[@]}"; do
                if [ "$s" = "$owner" ]; then match=1; break; fi
              done
              if [ "$match" -ne 1 ]; then continue; fi
            fi
            # Fold-time architecture assertion: every per-arch source tag must
            # contain an image manifest of the architecture its suffix
            # declares. The builders tag host-arch output (bake pins
            # platforms=[host] and `--tag-suffix <arch>` is a pure string), so
            # a mis-scheduled build silently produces e.g. an -amd64 tag
            # holding arm64 images. Catch it HERE, before imagetools create,
            # instead of publishing a corrupt index. Expected arch is derived
            # from the same suffix literals the fold uses below. Manifest-only
            # inspection (`inspect --raw`): no pulls, no downloads.
            for expected in amd64 arm64; do
              src="${T}-${expected}"
              if ! found=$(manifest_arches "$src"); then
                echo "::error:: Architecture assertion failed: could not inspect the manifest of source tag ${src} (expected '-${expected}' content). Refusing to fold ${T}" >&2
                exit 1
              fi
              if [ -z "$found" ]; then
                echo "::error:: Architecture assertion failed: source tag ${src} contains no concrete image manifest (only attestations or empty index). Refusing to fold ${T}" >&2
                exit 1
              fi
              for a in $found; do
                if [ "$a" != "$expected" ]; then
                  echo "::error:: Architecture assertion failed: source tag ${src} contains architecture ${a} but its '-${expected}' suffix declares ${expected}. Refusing to fold ${T} — check which runner (arch) served the build job for ${src}" >&2
                  exit 1
                fi
              done
            done
            echo "Merging OCI index: $T  <-  ${T}-amd64, ${T}-arm64"
            docker buildx imagetools create -t "$T" "${T}-amd64" "${T}-arm64"
          done

  # Content verification of the PUBLISHED artifact. A 200 manifest proves
  # existence, not content: nothing in the publish path ever asserted what
  # the pushed image actually contains. Each image already carries its own
  # content contract at /opt/solen/run-postinstall-checks.sh (written
  # UNCONDITIONALLY by the Dockerfile template, with the per-feature checks
  # baked in) — it has simply never been executed against a published image.
  # This job pulls the folded -amd64 members and runs that script, plus an
  # independent binary floor (rsync/jq/cmake, a strict subset of the
  # executables in inputs/apt-packages/base.required).
  # Deliberately does NOT arm the post-install-checks build ARG at publish
  # build time: it is promoted to ENV and consumed by the install RUN layer,
  # so flipping it
  # invalidates that layer and turns the heavy job's cached path into a
  # guaranteed ~60-min cold re-execution (or, if the cache key ignored the
  # ARG, false assurance). Executing the baked script here verifies the
  # artifact exactly as shipped, with zero cache impact.
  # Leaf job: NOTHING needs it — sign-release must not be blocked by a
  # verification-harness hiccup.
  verify-published:
    name: Verify published artifact content
    needs: [merge-index]
    # amd64 pool, same label list as build-amd64-standard (see the comment
    # there): the arm pool's runners also carry the bare `ebpro-org` label,
    # so `runs-on: ebpro-org` alone could route this job to arm64, where
    # -amd64 images cannot be docker-run (no binfmt by design). `x64` pins
    # native execution.
    runs-on: [self-hosted, linux, x64, ebpro-org]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install solen-cli
        run: |
          python -m pip install --upgrade pip
          pip install -e solen-cli

      - name: Generate profiles
        run: |
          solen generate profiles --matrix profiles/matrix --out generated/profiles --chain

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate base bake (no suffix, no build tag)
        run: |
          solen generate bake --output generated/docker-bake.hcl --repo "$IMAGE_REPO" --image-name "$IMAGE_NAME" --no-build-tag

      - name: Verify published images
        env:
          PROFILE_LIST: ${{ github.event.inputs.profiles || '' }}
        run: |
          set -uo pipefail
          # Same slug/ownership filter idiom as merge-index: on a subset
          # dispatch, verify only the tags OWNED by requested profiles
          # (this run pushed them); empty PROFILE_LIST = verify all.
          compute_slug() {
            local p="$1"
            if [[ "$p" =~ ^[0-9]+- ]]; then p="${p#*-}"; fi
            if [[ "$p" =~ ^[0-9]+- ]]; then p="${p#*-}"; fi
            echo "$p"
          }
          req_slugs=()
          if [ -n "$PROFILE_LIST" ]; then
            IFS=',' read -r -a _req <<< "$PROFILE_LIST"
            for p in "${_req[@]}"; do
              p=$(echo "$p" | xargs)
              if [ -z "$p" ]; then continue; fi
              req_slugs+=("$(compute_slug "$p")")
            done
          fi
          all_slugs=()
          while IFS= read -r sline; do
            [ -n "$sline" ] && all_slugs+=("$sline")
          done < <(
            for f in generated/profiles/*; do
              [ -f "$f" ] && compute_slug "$(basename "$f")"
            done | sort -u
          )
          # Enumerate the base refs exactly as merge-index does, then aim at
          # the amd64 member it folded (arm64 content is the arm builder's
          # contract-check job's problem; this pool cannot run it natively).
          tags=()
          # while-read over the grep output (not `for T in $(grep …)`):
          # one ref per line, and it keeps the step shellcheck-clean.
          while IFS= read -r T; do
            # Skip the bare repo ref from the generated header comment (no tag).
            if [[ "$T" != *:* ]]; then continue; fi
            if [ "${#req_slugs[@]}" -gt 0 ]; then
              tag=${T#*:}
              owner=""
              for s in "${all_slugs[@]}"; do
                if [[ "$tag" == "$s" || "$tag" == "$s"-* ]] && [ "${#s}" -gt "${#owner}" ]; then
                  owner="$s"
                fi
              done
              if [ -z "$owner" ]; then continue; fi
              match=0
              for s in "${req_slugs[@]}"; do
                if [ "$s" = "$owner" ]; then match=1; break; fi
              done
              if [ "$match" -ne 1 ]; then continue; fi
            fi
            tags+=("${T}-amd64")
          done < <(grep -oE 'ghcr.io/[^"]+' generated/docker-bake.hcl | sort -u)
          # Vacuous-pass guard: zero enumerated tags means the harness is
          # broken (bake generation, grep idiom, profiles). Passing
          # verification over an empty list is precisely the silent-skip
          # defect class this job exists to eliminate — fail loudly.
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "::error:: verify-published: enumerated ZERO amd64 tags from generated/docker-bake.hcl — refusing to pass vacuously; check the bake generation above" >&2
            exit 1
          fi
          echo "Verifying ${#tags[@]} published amd64 image(s)"
          failed=0
          for TAG in "${tags[@]}"; do
            echo "::group::verify $TAG"
            # 1. The per-feature content contract already baked into the
            #    image, executed on the published artifact.
            if ! docker run --rm --pull always --entrypoint /opt/solen/run-postinstall-checks.sh "$TAG"; then
              echo "::error:: Post-install contract checks FAILED on $TAG" >&2
              failed=1
            fi
            # 2. Independent binary floor: does not trust the baked script
            #    or the feature graph. TAG is passed in so the in-container
            #    bash can name the offending image in the annotation.
            if ! docker run --rm --pull always -e TAG="$TAG" --entrypoint bash "$TAG" -lc 'for b in rsync jq cmake; do command -v "$b" >/dev/null || { echo "::error::${TAG} missing ${b}"; exit 1; }; done'; then
              echo "::error:: Binary floor (rsync/jq/cmake) FAILED on $TAG" >&2
              failed=1
            fi
            echo "::endgroup::"
          done
          # Accumulate, never fail-fast: one bad image must fail the job,
          # but every image still gets tested so one report shows the blast
          # radius instead of hiding behind the first failure.
          exit "$failed"

  # Post-merge signing: consume the native `solen` OCI index produced by
  # `merge-index` and sign the release tag with cosign. Release-only (v* tags):
  # no QEMU/binfmt, no buildx builder, no imagetools promotion — the index
  # already exists at <slug>-v<version> (single `v`, no double-`v` bug).
  sign-release:
    name: Sign release (solen index)
    needs: [merge-index]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ebpro-org
    env:
      REPO: ghcr.io/${{ github.repository_owner }}
      IMAGE_NAME: solen
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install solen-cli
        run: pip install -e solen-cli
      - name: Generate profiles
        run: solen generate profiles --matrix profiles/matrix --out generated/profiles --chain
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare cosign key
        run: |
          if [ -n "${{ secrets.COSIGN_PRIVATE_KEY }}" ]; then
            echo "${{ secrets.COSIGN_PRIVATE_KEY }}" | base64 -d > cosign.key
            chmod 600 cosign.key
          fi
      - name: Sign solen release indexes
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          version=${GITHUB_REF#refs/tags/v}
          for profile in $(solen list profiles); do
            profile_slug=$(echo "$profile" | sed -E 's/^[0-9]+(-[0-9]+)*-//')
            sign_tag="${profile_slug}-v${version}"
            ref="${REPO}/${IMAGE_NAME}:${sign_tag}"
            if [ -f cosign.key ]; then
              echo "Signing ${ref}"
              COSIGN_PASSWORD="${COSIGN_PASSWORD}" cosign sign --key cosign.key "${ref}"
            else
              echo "No cosign key present, skipping signing for ${ref}"
            fi
          done

  # Toolcache mirror — publish side. The mirror's digest SoT is the in-repo
  # checksums.json. This job's commit-range diff of that file USED to be the
  # mirror's refresh trigger, consumed by mirror-artefacts through
  # `needs.changes.outputs.checksums`; it no longer gates the mirror (see the
  # mirror-artefacts comment for why range-diff gating was retired). The job
  # itself stays: the build legs still list `changes` in `needs` for the
  # advisory ordering edge, and a red `changes` job still taints the run
  # conclusion that ci-build.yml's promotion gate reads.
  # Fail-open by construction: an unresolvable before-SHA range (force-push,
  # branch creation, tag, workflow_dispatch payload) defaults to changed=true
  # so a rewritten history can NEVER silently skip publishing. A needless
  # push is harmless (the mirror is content-addressed and idempotent); a
  # skipped one is the failure mode. Pure git diff — no registry access — so
  # it runs on the hosted pool already used by ci-validate.yml and
  # validate-artefacts.yml, keeping the self-hosted pools for the builds.
  changes:
    name: Detect checksums.json change
    runs-on: ubuntu-latest
    outputs:
      checksums: ${{ steps.detect.outputs.checksums }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect checksums.json change
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          BEFORE="${BEFORE:-}"
          # No `set -e`: every branch below ends in an explicit output and
          # exit 0. This step must not be able to fail the run — a red
          # `changes` job would block ci-build.yml's promotion gate exactly
          # like a failed mirror push.
          if [ -z "$BEFORE" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "before-SHA '${BEFORE:-<empty>}' is unresolvable in this history (force-push, branch creation, tag or dispatch) — defaulting to changed=true"
            echo "checksums=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$BEFORE" "$GITHUB_SHA" -- checksums.json; then
            echo "checksums.json unchanged between ${BEFORE:0:12} and ${GITHUB_SHA:0:12}"
            echo "checksums=false" >> "$GITHUB_OUTPUT"
          else
            echo "checksums.json changed between ${BEFORE:0:12} and ${GITHUB_SHA:0:12}"
            echo "checksums=true" >> "$GITHUB_OUTPUT"
          fi

  # Publishes the six download_direct tool archives (both arches) as
  # content-addressed OCI objects under Harbor solen/toolcache-<tool>-<arch>
  # — SINGLE-LEVEL repo names. Root cause of the run-39018544362 failure
  # (12/12 pushes, 502 on the first config-blob POST): Harbor parses the
  # first path segment as the project and mishandles the nested two-segment
  # form; the same runner and the same robot credential pushed fine to the
  # single-level solen/build-cache in that very run. Do not reintroduce
  # nesting. (scripts/stage-toolcache.sh --mode push: upstream fetch ->
  # verify against in-repo checksums.json -> push missing blobs;
  # already-published objects are skipped). TRIGGER POLICY (rewritten after
  # production proved the old one fragile): runs on EVERY push to develop and
  # on every workflow_dispatch, plus the explicit mirror_force door — it no
  # longer consumes the `changes` range-diff output at all. Reason: a
  # one-time "did this commit range touch checksums.json?" gate lost the
  # seeding event three times — runs 39127999375 (b514de1), 39128743942
  # (77b3272) and 39128767925 (bb2a2dc) were each replaced while still
  # pending and cancelled with ZERO jobs, and run 39120654609 (9225c0d)
  # completed with this job `skipped`; the HEAD-push run 39129344307
  # (90e8db8) then diffed bb2a2dc..90e8db8, which contains no checksums.json
  # change, so the six never-pushed blobs would have stayed orphaned forever
  # (no later range includes b514de1's change). Because mode_push is
  # content-addressed and idempotent (`already published; skipping`), running
  # unconditionally on develop is cheap and SELF-HEALING: any blob missed by
  # a failed or cancelled run is retried by the very next develop push.
  # v* tag pushes intentionally do NOT run it: tags are cut on the develop
  # tip, whose push already mirrored the same checksums.json. This workflow
  # has no pull_request trigger, so PR behaviour is unchanged (never ran).
  # The push step is continue-on-error ON PURPOSE: ci-build.yml
  # gates develop promotion on the conclusion of this whole run ("Publish to
  # GHCR"), so a Harbor outage or a flaky origin during a MIRROR push must
  # never block a release — the mirror is an availability hedge, not a
  # publish requirement. The robot credential exists and works (same secret
  # as the build cache); failures are LOUD — a red step plus an ::error::
  # annotation with the failing count — while the job stays green.
  mirror-artefacts:
    name: Mirror toolcache archives to Harbor
    # No `needs`: the mirror must not wait on — or be conditioned to — the
    # `changes` range-diff output. That dependence is exactly what orphaned
    # six blobs when the runs carrying the seeding diff (39127999375,
    # 39128743942, 39128767925) were replaced before their first job started.
    # Gate: unconditional on develop pushes (idempotent skip for existing
    # blobs makes the steady-state cost negligible) and on workflow_dispatch
    # (manual re-verify); mirror_force is kept as the explicit override door
    # for forced re-verification on other refs — redundant-but-harmless on a
    # dispatch, and the documented bootstrap/re-seed lever. An explicit `if`
    # with no `needs` keeps this job trigger-driven only.
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/develop') || github.event_name == 'workflow_dispatch' || github.event.inputs.mirror_force == 'true' }}
    # Same amd64 self-hosted pool as the standard builds (the push fetches
    # amd64+arm64 ARCHIVES over HTTPS — no container execution, so host arch
    # is irrelevant; x64 pins it to the pool that reliably egresses).
    runs-on: [self-hosted, linux, x64, ebpro-org]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pure diagnostic, run immediately before the push: GET/HEAD only, NO
      # registry writes, always exit 0. Separates the three failure classes
      # this registry has shown — runner egress, token scope, and the
      # run-39018544362 nested-path 5xx — so the push step's red annotation
      # can be interpreted without log archaeology.
      - name: Harbor mirror pre-flight probe (read-only)
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_ROBOT_SECRET: ${{ secrets.HARBOR_ROBOT_SECRET }}
        run: |
          set -uo pipefail
          HARBOR_BASE="${HARBOR_BASE_URL:-https://harbor.ebruno.fr}"
          REPO="solen/toolcache-helm-amd64"   # probe subject; single-level name
          # Presence only — secret values are NEVER echoed.
          if [ -n "${HARBOR_ROBOT_SECRET:-}" ]; then secret_state="set"; else secret_state="<unset>"; fi
          echo "Pre-flight (read-only): HARBOR_USERNAME=${HARBOR_USERNAME:-<unset>} HARBOR_ROBOT_SECRET=$secret_state"
          # 1) Registry liveness: authenticated GET /v2/. 200 or 401 (the
          #    healthy Bearer challenge) proves the runner reaches Harbor.
          alive="$(curl -sS -o /dev/null -w '%{http_code}' -m 20 -u "${HARBOR_USERNAME:-nobody}:${HARBOR_ROBOT_SECRET:-}" "$HARBOR_BASE/v2/" 2>/dev/null || true)"
          case "${alive:-000}" in
            200|401) echo "pre-flight: registry alive (GET /v2/ -> ${alive:-000})" ;;
            000) echo "::warning::Pre-flight: NO EGRESS to $HARBOR_BASE (GET /v2/ unreachable). The push below is expected to fail the same way; the job stays green by design." ;;
            *) echo "::warning::Pre-flight: unexpected HTTP ${alive:-000} from GET /v2/ (expected 200|401) — Harbor itself is misbehaving." ;;
          esac
          # 2) Token exchange scoped exactly like the push (pull,push on one
          #    single-level mirror repo).
          TJ="$(mktemp)"
          tcode="$(curl -sS -o "$TJ" -w '%{http_code}' -m 20 --get "$HARBOR_BASE/service/token" -u "${HARBOR_USERNAME:-nobody}:${HARBOR_ROBOT_SECRET:-}" --data-urlencode 'service=harbor-registry' --data-urlencode "scope=repository:$REPO:pull,push" 2>/dev/null || true)"
          tok="$(jq -r '.token // empty' "$TJ" 2>/dev/null || true)"
          rm -f "$TJ"
          case "${tcode:-000}" in
            200)
              if [ -n "$tok" ]; then
                echo "pre-flight: scoped token issued for $REPO (pull,push)"
              else
                echo "::warning::Pre-flight: TOKEN-SCOPE failure — /service/token answered 200 with an empty token for repository:$REPO:pull,push; the robot account likely lacks access to this repo."
              fi ;;
            401|403) echo "::warning::Pre-flight: TOKEN-SCOPE/credential failure — /service/token -> HTTP ${tcode} (robot rejected)." ;;
            000) echo "::warning::Pre-flight: NO EGRESS to $HARBOR_BASE for /service/token." ;;
            500|502|503|504) echo "::warning::Pre-flight: /service/token -> HTTP ${tcode} — server-side 5xx, the run-39018544362 failure class." ;;
            *) echo "::warning::Pre-flight: /service/token -> unexpected HTTP ${tcode:-000}." ;;
          esac
          # 3) Repository addressability: one HEAD on a manifest reference that
          #    cannot exist. 404 is the GOOD pre-push state — the registry
          #    parsed the single-level path and the repo is routable. A
          #    5xx/timeout here is the run-39018544362 signature.
          if [ -n "$tok" ]; then
            mcode="$(curl -sS -o /dev/null -w '%{http_code}' -m 20 -I -H "Authorization: Bearer $tok" -H 'Accept: application/vnd.oci.image.manifest.v1+json' "$HARBOR_BASE/v2/$REPO/manifests/sha256-preflight-probe" 2>/dev/null || true)"
            case "${mcode:-000}" in
              404) echo "pre-flight: $REPO addressable (HEAD manifest -> 404, the expected pre-push state)" ;;
              200) echo "pre-flight: $REPO addressable (HEAD manifest -> 200 — probe tag unexpectedly present; harmless)" ;;
              401|403) echo "::warning::Pre-flight: TOKEN-SCOPE failure on HEAD $REPO — HTTP ${mcode} despite an issued token (scope not honoured)." ;;
              000) echo "::warning::Pre-flight: NO EGRESS on HEAD $REPO." ;;
              500|502|503|504) echo "::warning::Pre-flight: HEAD $REPO -> HTTP ${mcode}. This is the run-39018544362 failure class (Harbor 5xx on this path form) — expect the push below to fail identically; the job stays green by design." ;;
              *) echo "::warning::Pre-flight: HEAD $REPO -> unexpected HTTP ${mcode:-000}." ;;
            esac
          else
            echo "::warning::Pre-flight: skipping the manifest HEAD — no scoped token available (see the token finding above)."
          fi
          # Advisory by design: whatever the probe found, it never fails the job.
          exit 0

      - name: Push toolcache mirror (advisory)
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_ROBOT_SECRET: ${{ secrets.HARBOR_ROBOT_SECRET }}
        continue-on-error: true
        run: |
          set -uo pipefail
          if [ -z "${HARBOR_USERNAME:-}" ] || [ -z "${HARBOR_ROBOT_SECRET:-}" ]; then
            echo "Toolcache mirror: credentials not visible in this scope (HARBOR_USERNAME=${HARBOR_USERNAME:-<unset>}, HARBOR_ROBOT_SECRET=${HARBOR_ROBOT_SECRET:+set}). Nothing published. NOTE: the robot credential EXISTS and works (it is the same secret that pushes solen/build-cache) — emptiness here means a secret-scoping problem, not an unprovisioned account. Releases are unaffected."
            exit 0
          fi
          # Loud failure surfacing: mode_push returns 1 when any entry failed,
          # and its ❌ lines name the repos. Tee to a log, count the failures,
          # annotate, then exit with the script's status so the STEP goes red
          # while continue-on-error keeps the JOB green. The build legs DO
          # `needs: [changes, mirror-artefacts]` (see :71/:381/:691) — for
          # ADVISORY ORDERING only: with the push continue-on-error and the
          # legs gated on !cancelled(), a red mirror can never skip the
          # release path, so this stays safe.
          LOG="$(mktemp)"
          scripts/stage-toolcache.sh --mode push --arch amd64,arm64 2>&1 | tee "$LOG"
          status=${PIPESTATUS[0]}
          fails="$(grep -cF '❌' "$LOG" || true)"
          if [ "$status" -ne 0 ] || [ "${fails:-0}" -gt 0 ]; then
            first="$(grep -m1 -F '❌' "$LOG" || true)"
            first="${first//%/%25}"
            echo "::error::Toolcache mirror push: ${fails:-0} failed entries (script exit $status). First: ${first:-<no ❌ line captured>}. The job stays green by design (continue-on-error; the build legs list mirror-artefacts in needs for advisory ordering only, never for its success) but the step is red — fix the mirror before the next checksums.json change."
          fi
          rm -f "$LOG"
          exit "$status"
