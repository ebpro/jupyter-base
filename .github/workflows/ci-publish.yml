          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Harbor is a SOFT dependency: the registry build cache only makes builds
      # faster, the GHCR push is the product. Probe it BEFORE logging in so an
      # outage is classified as such and never mistaken for a bad credential.
      # No secret is referenced, printed or passed by this step: it is an
      # unauthenticated GET /v2/ only.
