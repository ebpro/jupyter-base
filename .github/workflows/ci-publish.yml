name: Publish to GHCR

on:
  push:
    branches: [ develop ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      profiles:
        description: 'Comma-separated profiles to publish (defaults to all generated)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}
  IMAGE_NAME: solen

# Serialize publish runs GLOBALLY: at most one "Publish to GHCR" run active at
# a time, so two runs can never interleave writes to the same mutable GHCR
# tags. Deliberately NOT scoped per-ref (`github.ref`): runs on different refs
# still collide — every run bakes the short commit SHA as a tag regardless of
# ref, so a v* tag run cut on the develop tip and the in-flight develop run of
# that same commit both push <slug>-<sha>-{amd64,arm64} and fold the
# <slug>-<sha> index concurrently; `group: ...-${{ github.ref }}` would allow
# exactly that race. cancel-in-progress stays FALSE on purpose: cancelling
# mid-publish does NOT undo already-pushed per-arch tags, and killing a run
# between the build jobs and merge-index leaves mutable tags half-updated with
# no fold to repair them — strictly worse than queueing. Queuing is the point:
# it serializes the index folds. Do not "fix" this to true.
concurrency:
  group: ci-publish-ghcr
  cancel-in-progress: false

# Per-arch publishing, native (no QEMU/binfmt). Each build job runs on a
# runner of its own architecture and passes its target arch EXPLICITLY to the
# bake generator (`--platforms` in BAKE_FLAGS, consumed by both the primary and
# the retry generate invocation), so the emitted definition declares the
# intended architecture instead of silently inheriting it from the host.
# Every tag is suffixed per-arch (T-amd64 / T-arm64)
# and `merge-index` folds them into an OCI index at T on all triggers
# (develop push, v* tag, workflow_dispatch).
jobs:
  # Native amd64 build of the standard (non-heavy) profiles.
  # `runs-on` as a label list is an AND over labels (GitHub docs: the job is
  # routed only to runners matching ALL specified labels). Requiring `x64`
  # makes the ARM pool (ebpro-org-arm: ebpro-org, linux, self-hosted, arm64 —
  # no `x64`) architecturally ineligible for this job, while the amd64
  # ebpro-org pool (ebpro-org, linux, x64, self-hosted) still satisfies all
  # four labels. This matters because the job tags host-arch content with
  # `--tag-suffix amd64` (a pure string), so an ARM runner here silently
  # produces `-amd64` tags holding arm64 images.
  build-amd64-standard:
    runs-on: [self-hosted, linux, x64, ebpro-org]
    env:
      IS_VTAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
      # Job-level so a step-level `if:` can express the secret-absent case as
      # `env.HARBOR_USERNAME != ''`: the `secrets` context in a step `if:` is
      # evaluated unreliably by Actions. A username, not a credential value —
      # and still never echoed anywhere.
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      ARCH: amd64
      SUBSET: standard
      BAKE_FLAGS: "--tag-suffix amd64 --no-build-tag --platforms linux/amd64"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install solen-cli
        run: |
          python -m pip install --upgrade pip
          pip install -e solen-cli

      - name: Fetch offloaded artefacts (if manifest available)
        env:
          ARTEFACTS_BASE_URL: ${{ secrets.ARTEFACTS_BASE_URL }}
          ARTEFACT_SHA256: ${{ secrets.ARTEFACT_SHA256 }}
        run: |
          set -uo pipefail
          manifest=""
          for m in artefacts/offload/toolcache-manifest-*.json; do
            [ -f "$m" ] && manifest="$m" && break
          done
          if [ -z "$manifest" ]; then
            echo "No offload manifest in repo; building from network downloads."
            exit 0
          fi
          echo "Using manifest: $manifest"
          chmod +x scripts/utils/fetch-artefacts.sh
          scripts/utils/fetch-artefacts.sh --manifest "$manifest" || {
            echo "WARNING: artefact fetch failed; continuing with network downloads" >&2
          }

      - name: Generate profiles, Dockerfile and bake file
        run: |
          echo "IS_VTAG=$IS_VTAG ARCH=$ARCH SUBSET=$SUBSET BAKE_FLAGS='$BAKE_FLAGS'"
          solen generate profiles --matrix profiles/matrix --out generated/profiles --chain
          solen generate dockerfile --all --output generated/Dockerfile
          solen generate bake --output generated/docker-bake.hcl --repo "$IMAGE_REPO" --image-name "$IMAGE_NAME" $BAKE_FLAGS --harbor-cache harbor.ebruno.fr/solen/build-cache

      - name: Set up BuildKit (docker-container driver for registry cache)
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Harbor is a SOFT dependency: the registry build cache only makes builds
      # faster, the GHCR push is the product. Probe it BEFORE logging in so an
      # outage is classified as such and never mistaken for a bad credential.
      # No secret is referenced, printed or passed by this step: it is an
      # unauthenticated GET /v2/ only.
      - name: Pre-flight Harbor probe (cache availability, no credentials)
        id: harbor
        continue-on-error: true
        run: |
          set -uo pipefail
          url="https://harbor.ebruno.fr/v2/"
          if [ -z "${HARBOR_USERNAME:-}" ]; then
            echo "harbor_ready=false" >> "$GITHUB_OUTPUT"
            echo "Harbor credentials are not configured for this runner scope; building without the registry cache."
            echo "::warning::HARBOR_USERNAME/HARBOR_ROBOT_SECRET are absent in this scope, so the Harbor build cache is skipped. This is a cache-availability issue, NOT a credential failure, and is NOT a reason to rotate HARBOR_ROBOT_SECRET."
            exit 0
          fi
          body="$(mktemp)"
          # No -f: a 401 must be readable as a status code, not swallowed as an
          # error. Registry v2 answers 401 (Bearer challenge) when HEALTHY, so
          # 200/401 => alive; timeout/000/5xx/DNS error => outage.
          code="$(curl -sS -o "$body" -m 10 -w '%{http_code}' "$url" 2>/dev/null || true)"
          [ -n "$code" ] || code="000"
          echo "Probe: GET $url (unauthenticated) -> HTTP $code"
          echo "Response body (first 400 bytes):"
          head -c 400 "$body"
          echo ""
          rm -f "$body"
          case "$code" in
            200|401)
              echo "harbor_ready=true" >> "$GITHUB_OUTPUT"
              echo "Harbor answered HTTP $code: the registry is alive ($code is the healthy Registry v2 challenge) and the cache stays enabled."
              ;;
            *)
              echo "harbor_ready=false" >> "$GITHUB_OUTPUT"
              echo "Harbor unreachable (HTTP $code); falling back to a cache-less build."
              echo "::warning::Harbor ($url) is UNREACHABLE (HTTP $code) — this is a cache-registry AVAILABILITY problem (outage, disk full, DNS or timeout), NOT a credential problem. Do NOT rotate HARBOR_ROBOT_SECRET. The build proceeds without the registry cache, so it is slower but the GHCR push is unaffected."
              ;;
          esac

      # Skipped when the probe saw an outage, and non-fatal when it fails: a
      # login-stage token death (attempt 2's shape) must not fail the job. Its
      # outcome feeds HARBOR_READY in the build step, which drops BOTH cache
      # directives on the floor when the cache cannot be trusted.
      - name: Login to Harbor (build cache)
        id: harbor-login
        if: steps.harbor.outputs.harbor_ready == 'true'
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: harbor.ebruno.fr
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_ROBOT_SECRET }}

      - name: Build and push (amd64, standard)
        env:
          PROFILE_LIST: ${{ github.event.inputs.profiles || '' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          # Harbor is ready only when the unauthenticated probe saw it alive
          # AND the login step did not fail. Derived from step outputs (never
          # the `secrets` context) so Actions evaluates it reliably.
          HARBOR_READY: ${{ steps.harbor.outputs.harbor_ready == 'true' && steps.harbor-login.outcome != 'failure' }}
        run: |
          set -euo pipefail
          # Heavy = quarto-full + every lang-java-* / quarto-java-* profile.
          is_heavy() {
            case "$1" in
              quarto-full|lang-java-*|quarto-java-*) return 0 ;;
              *) return 1 ;;
            esac
          }
          if [ -n "$PROFILE_LIST" ]; then
            IFS=',' read -r -a arr <<< "$PROFILE_LIST"
          else
            arr=()
            for f in generated/profiles/*; do
              [ -f "$f" ] && arr+=("$(basename "$f")")
            done
          fi
          filtered=()
          for p in "${arr[@]}"; do
            p=$(echo "$p" | xargs)
            [ -n "$p" ] || continue
            case "$SUBSET" in
              all)      filtered+=("$p") ;;
              heavy)    if is_heavy "$p"; then filtered+=("$p"); fi ;;
              standard) if ! is_heavy "$p"; then filtered+=("$p"); fi ;;
            esac
          done
          echo "Subset '$SUBSET' on $ARCH -> ${#filtered[@]} profile(s)"
          if [ "${#filtered[@]}" -eq 0 ]; then
            echo "Nothing to build for this job; skipping."
            exit 0
          fi
          # Cache posture, decided once per job and never fatal. With Harbor
          # trusted, use the bake produced by the validated Generate step,
          # untouched. Otherwise generate a SEPARATE cache-less bake with
          # --no-cache, which omits BOTH cache-from and cache-to: --no-cache-to
          # deliberately keeps cache-from and therefore cannot recover an
          # importer-side 401/connection failure. Cost of the fallback is a
          # cold build, never a failed publish.
          if [ "$HARBOR_READY" = "true" ]; then
            BAKE_FILE=generated/docker-bake.hcl
          else
            echo "Harbor unavailable; building without any registry cache (slower, by design)." >&2
            # Word-split the flag string through a quoted herestring read rather
            # than an unquoted expansion, so no new shellcheck/SC2086 finding is
            # added to the actionlint baseline.
            read -r -a nocache_bake_args <<< "$BAKE_FLAGS"
            solen generate bake --no-cache --output generated/docker-bake-nocache.hcl --repo "$IMAGE_REPO" --image-name "$IMAGE_NAME" "${nocache_bake_args[@]}"
            BAKE_FILE=generated/docker-bake-nocache.hcl
          fi
          for profile in "${filtered[@]}"; do
            echo "Publishing profile: $profile (arch: $ARCH)"
            # The Harbor registry cache (cache-from + cache-to) is carried by
            # the generated bake file (--harbor-cache in the Generate step).
            # The cache-to export is best-effort: Harbor answers 499 (Client
            # Closed Request) on large layer uploads (e.g. quarto-containers),
            # which must not fail the build — the GHCR push is what matters.
            # On failure: regenerate the bake WITHOUT cache-to (cache-from is
            # kept) into a distinct file (generated/docker-bake-retry.hcl) and
            # retry once; the retry's exit code is propagated, so a GHCR push
            # failure still fails the build. The main bake file is never
            # rewritten, so remaining profiles keep the cache-to export.
            if docker buildx bake --file "$BAKE_FILE" "final-$profile" \
              --set "*.args.SSH_PRIVATE_KEY=${SSH_PRIVATE_KEY}" \
              --push; then
              echo "Build/push succeeded for $profile"
              continue
            fi
            # The retry below exists only for the Harbor 499-on-large-layer
            # cache-to case and still reads the Harbor cache (cache-from).
            # When Harbor was already excluded there is nothing left to drop,
            # so fail with an accurate reason instead of retrying against a
            # registry known to be unreachable.
            if [ "$HARBOR_READY" != "true" ]; then
              echo "ERROR: build failed for $profile on the cache-less bake; the Harbor cache is already excluded, so there is no further retry to make" >&2
              exit 1
            fi
            echo "WARN: build failed for $profile (likely 499 on the Harbor cache-to export for a large layer); regenerating bake WITHOUT cache-to and retrying" >&2
            solen generate bake --no-cache-to --output generated/docker-bake-retry.hcl --repo "$IMAGE_REPO" --image-name "$IMAGE_NAME" $BAKE_FLAGS --harbor-cache harbor.ebruno.fr/solen/build-cache
            docker buildx bake --file generated/docker-bake-retry.hcl "final-$profile" \
              --set "*.args.SSH_PRIVATE_KEY=${SSH_PRIVATE_KEY}" \
              --push
          done

  # Native amd64 build of ONLY the heavy/flagship profiles (quarto-full + lang-java-*
  # + quarto-java-*), isolated on the larger pool for resource headroom.
  build-amd64-heavy:
    runs-on: ebpro-org-large
    env:
      IS_VTAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
      # Job-level so a step-level `if:` can express the secret-absent case as
      # `env.HARBOR_USERNAME != ''`: the `secrets` context in a step `if:` is
      # evaluated unreliably by Actions. A username, not a credential value —
      # and still never echoed anywhere.
