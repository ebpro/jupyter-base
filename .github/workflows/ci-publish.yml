name: Publish to GHCR

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      profiles:
        description: 'Comma-separated profiles to publish (defaults to all generated)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}
  IMAGE_NAME: ${{ github.event.repository.name }}

jobs:
  publish:
    # In-cluster ARC runner (actions-runner-controller) with a privileged
    # docker:dind sidecar; multi-arch via QEMU + docker-container driver.
    runs-on: ebpro-org
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install solen-cli
        run: |
          python -m pip install --upgrade pip
          pip install -e solen-cli

      - name: Fetch offloaded artefacts (if manifest available)
        env:
          ARTEFACTS_BASE_URL: ${{ secrets.ARTEFACTS_BASE_URL }}
          ARTEFACT_SHA256: ${{ secrets.ARTEFACT_SHA256 }}
        run: |
          set -uo pipefail
          manifest=""
          for m in artefacts/offload/toolcache-manifest-*.json; do
            [ -f "$m" ] && manifest="$m" && break
          done
          if [ -z "$manifest" ]; then
            echo "No offload manifest in repo; building from network downloads."
            exit 0
          fi
          echo "Using manifest: $manifest"
          chmod +x scripts/utils/fetch-artefacts.sh
          scripts/utils/fetch-artefacts.sh --manifest "$manifest" || {
            echo "WARNING: artefact fetch failed; continuing with network downloads" >&2
          }

      - name: Register QEMU emulators for multi-arch
        run: docker run --rm --privileged tonistiigi/binfmt:latest --install

      - name: Create multi-arch buildx builder
        run: docker buildx create --name multiarch --driver docker-container --use

      - name: Generate profiles, Dockerfile and bake file
        run: |
          solen generate profiles --matrix profiles/matrix --out generated/profiles --chain
          solen generate dockerfile --all --output generated/Dockerfile
          solen generate bake --output generated/docker-bake.hcl

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64 + linux/arm64)
        env:
          PROFILE_LIST: ${{ github.event.inputs.profiles || github.inputs.profiles || '' }}
        run: |
          set -euo pipefail
          if [ -n "$PROFILE_LIST" ]; then
            IFS=',' read -r -a arr <<< "$PROFILE_LIST"
          else
            arr=()
            for f in generated/profiles/*; do
              [ -f "$f" ] && arr+=("$(basename "$f")")
            done
          fi
          for profile in "${arr[@]}"; do
            profile=$(echo "$profile" | xargs)
            echo "Publishing profile: $profile"
            docker buildx bake --file generated/docker-bake.hcl "final-$profile" \
              --set '*.platform=linux/amd64,linux/arm64' --push
          done
