name: CI Build & SBOM

on:
  # Develop promotion path: fires AFTER "Publish to GHCR" completes on develop.
  # The image is already built + pushed by ci-publish.yml; this workflow PULLS
  # it instead of rebuilding, eliminating the double-build on develop.
  workflow_run:
    workflows: ["Publish to GHCR"]
    types: [completed]
    branches: [develop]
  pull_request:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      profiles:
        description: 'Comma-separated list of profiles to build (defaults to quarto-full, the first MVP)'
        required: false
        default: 'quarto-full'
      no-cache:
        description: 'Disable buildx cache'
        required: false
        default: 'false'
      run-postinstall-checks:
        description: 'Run feature postInstallCheck commands in built images (select false to skip)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

env:
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}
  IMAGE_NAME: solen

jobs:
  build:
    # On the develop promotion path (workflow_run), skip if the triggering
    # "Publish to GHCR" run did not succeed — there is no image to pull then.
    # PR + dispatch always run (they build locally).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    # In-cluster ARC runner (actions-runner-controller) with a privileged
    # docker:dind sidecar, so buildx works exactly as in a plain docker env.
    runs-on: ebpro-org
    steps:
      - name: Export DOCKER_CONFIG
        # Runner-side regression (2026-10): /home/runner/.docker is read-only,
        # so buildx cannot create its default state dir there. Point
        # Docker/buildx at the runner temp instead. Written via GITHUB_ENV
        # because the runner context is not allowed in jobs.<id>.env.
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/.docker" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install solen-cli
        run: |
          python -m pip install --upgrade pip
          pip install -e solen-cli

      - name: Generate profiles
        run: solen generate profiles --matrix profiles/matrix --out generated/profiles --chain

      - name: Generate Dockerfile and bake file
        run: |
          solen generate dockerfile --all --output generated/Dockerfile
          solen generate bake --output generated/docker-bake.hcl --repo "$IMAGE_REPO" --image-name "$IMAGE_NAME"

      # Toolcache mirror — consume side (PR builds). The build job here is
      # single-arch and NATIVE: there is no strategy.matrix and no per-job
      # ARCH env (unlike ci-publish.yml's per-arch legs), and the PR/dispatch
      # leg runs `docker buildx bake --load` with no --platform, so the image
      # arch is the runner's own arch — derived from `uname -m` inside the
      # step and passed to the staging script. Stages publisher-digest-pinned
      # archives from Harbor solen/toolcache-<tool>-<arch> into
      # toolcache-stage/ (a build-context sibling of artefacts/, outside the
      # `COPY artefacts` tree), which the generated Dockerfile's install RUN
      # seeds into /opt/toolcache — so the install RUN hits the local
      # toolcache instead of egressing to get.helm.sh & co, the origin whose
      # egress keeps timing out on these runners. Best-effort by design:
      # credentials absent => clean skip; misses => loud ::warning:: +
      # upstream fallback, never a PR-build failure. TOOLCACHE_STRICT is
      # deliberately NOT inherited: that repository variable arms the
      # ci-publish legs and must not be able to fail a PR build. Harbor auth
      # is the script's own Bearer-token exchange (no docker login step).
      - name: Stage toolcache mirror (pull, best-effort)
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_ROBOT_SECRET: ${{ secrets.HARBOR_ROBOT_SECRET }}
        run: |
          set -uo pipefail
          # Ensure the build-context bind dir exists on EVERY path (including
          # the early-skip below), so the Dockerfile's toolcache-stage bind
          # never hard-fails on a missing source dir.
          mkdir -p toolcache-stage
          # The build leg below is native single-arch (no --platform): stage
          # the runner's own arch so the staged toolcache matches the image.
          case "$(uname -m)" in
            x86_64|amd64) ARCH=amd64 ;;
            aarch64|arm64) ARCH=arm64 ;;
            *) ARCH="" ;;
          esac
          if [ -z "${HARBOR_USERNAME:-}" ] || [ -z "${HARBOR_ROBOT_SECRET:-}" ]; then
            echo "Toolcache mirror: credentials not configured in this scope (HARBOR_USERNAME=${HARBOR_USERNAME:-<unset>}, HARBOR_ROBOT_SECRET=${HARBOR_ROBOT_SECRET:+set}). Skipping staging — behaviour is identical to before the mirror existed (upstream downloads)."
            exit 0
          fi
          # mode_pull always returns 0, so an `if ! scripts/…` wrapper around
          # it could never fire. Surface misses from the script's own markers
          # instead: grep -F on the ⚠ / ❌ byte prefixes (the script emits
          # ⚠️ with a trailing VS16; the bare ⚠ codepoint matches it as a
          # byte-substring). Loud but non-failing by default: a mirror miss is
          # never a build-leg failure unless TOOLCACHE_STRICT=true.
          LOG="$(mktemp)"
          scripts/stage-toolcache.sh --mode pull --arch "$ARCH" --out toolcache-stage 2>&1 | tee "$LOG"
          status=${PIPESTATUS[0]}
          misses="$(grep -cF -e '⚠' -e '❌' "$LOG" || true)"
          if [ "$status" -ne 0 ] || [ "${misses:-0}" -gt 0 ]; then
            first="$(grep -m1 -F -e '⚠' -e '❌' "$LOG" || true)"
            first="${first//%/%25}"
            echo "::warning::Toolcache mirror staging on ARCH=$ARCH: exit=$status, ${misses:-0} warn/error entries. First: ${first:-<none captured>}. Proceeding with upstream downloads — this leg behaves exactly as before the mirror existed."
          fi
          # Completeness gate. mode_pull emits exactly one machine-readable
          # line "toolcache-pull-summary arch=… expected=N present=M missing=K";
          # present < expected (or a missing summary line) means at least one
          # pinned archive will miss the toolcache inside the install RUN and
          # egress to origin — the failure mode behind the 8da2bd8 leg deaths.
          # The find cross-check is printed for the log; the trigger per
          # contract is present < expected. Fail only under TOOLCACHE_STRICT.
          incomplete=false
          summary="$(grep -m1 '^toolcache-pull-summary' "$LOG" || true)"
          if [ -z "$summary" ]; then
            echo "::warning::Toolcache mirror on ARCH=$ARCH: no toolcache-pull-summary line emitted — completeness cannot be assessed."
            incomplete=true
          else
            expected="$(printf '%s\n' "$summary" | tr ' ' '\n' | sed -n 's/^expected=//p')"
            present="$(printf '%s\n' "$summary" | tr ' ' '\n' | sed -n 's/^present=//p')"
            missing="$(printf '%s\n' "$summary" | tr ' ' '\n' | sed -n 's/^missing=//p')"
            files="$(find toolcache-stage -type f 2>/dev/null | wc -l | tr -d ' ')"
            echo "Toolcache mirror completeness: arch=$ARCH expected=${expected:-?} present=${present:-?} missing=${missing:-?} staged-files=$files"
            if [ "${present:-0}" -lt "${expected:-0}" ]; then
              echo "::warning::Toolcache mirror INCOMPLETE on ARCH=$ARCH: ${present:-0}/${expected:-0} entries staged (missing=${missing:-?}, staged files=$files). Unstaged tools will fall back to origin downloads inside the install RUN."
              incomplete=true
            fi
          fi
          rm -f "$LOG"
          if [ "$incomplete" = true ] && [ "${TOOLCACHE_STRICT:-}" = "true" ]; then
            echo "::error::TOOLCACHE_STRICT=true and toolcache staging was incomplete on ARCH=$ARCH — failing the leg instead of risking silent origin egress."
            exit 1
          fi
          exit 0

      - name: Acquire profiles (pull on develop promotion, build on PR/dispatch)
        id: build
        env:
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          PROFILE_LIST: ${{ github.event.inputs.profiles || 'quarto-full' }}
          NO_CACHE: ${{ github.event.inputs['no-cache'] || 'false' }}
        run: |
          set -euo pipefail
          # Human-friendly slug: strip leading numeric prefixes (digits- digits-),
          # mirroring solen.generators.bake.compute_profile_slug.
          compute_slug() {
            local p="$1"
            if [[ "$p" =~ ^[0-9]+- ]]; then p="${p#*-}"; fi
            if [[ "$p" =~ ^[0-9]+- ]]; then p="${p#*-}"; fi
            echo "$p"
          }
          # First tag from the generated bake file for a profile (what the
          # post-install / SBOM / Trivy steps consume).
          first_tag_for() {
            sed -n "/^target \"final-$1\" /,/^}/p" generated/docker-bake.hcl \
              | awk '/tags = \[/{flag=1; next} flag && /\]/{exit} flag {gsub(/[",]/, ""); gsub(/^[ \t]+|[ \t]+$/, ""); if ($0 != "") {print; exit}}'
          }
          IFS=',' read -r -a arr <<< "$PROFILE_LIST"
          : > profiles-built.txt
          if [ "$EVENT" = "workflow_run" ]; then
            # Develop promotion: the image is already published by
            # "Publish to GHCR" (on develop the per-commit tag is
            # <slug>-<short-sha>). Pull it and re-tag to the bake file's
            # first tag so downstream steps find it locally.
            SHORT_SHA="${HEAD_SHA:0:7}"
            echo "Develop promotion: pulling published image(s) for commit ${SHORT_SHA} (conclusion: ${CONCLUSION})"
            for profile in "${arr[@]}"; do
              profile=$(echo "$profile" | xargs)
              [ -n "$profile" ] || continue
              target_tag="$(first_tag_for "$profile")"
              if [ -z "$target_tag" ]; then
                echo "No tag found in bake file for $profile; skipping" >&2
                continue
              fi
              pull_ref="${IMAGE_REPO}/${IMAGE_NAME}:$(compute_slug "$profile")-${SHORT_SHA}"
              echo "Pulling $pull_ref  ->  $target_tag"
              # Pull the published image. Prefer the runner's native arch; fall back to
              # linux/amd64 if the image predates multi-arch (amd64-only) and the runner
              # is arm64 ("no matching manifest for linux/arm64/v8"). amd64 is always
              # published, so the pull cannot fail; SBOM/Trivy scans are arch-agnostic.
              if ! docker pull "$pull_ref"; then
                echo "WARN: native-arch pull failed for $pull_ref (pre-multi-arch image?); retrying with linux/amd64" >&2
                docker pull --platform linux/amd64 "$pull_ref"
              fi
              docker tag "$pull_ref" "$target_tag"
              echo "$profile" >> profiles-built.txt
            done
          else
            # PR / dispatch: build locally (single-arch, loaded into local daemon).
            NO_CACHE_FLAG=""
            if [ "$NO_CACHE" = 'true' ]; then
              NO_CACHE_FLAG="--set *.no-cache=true"
            fi
            for profile in "${arr[@]}"; do
              profile=$(echo "$profile" | xargs)
              echo "Building profile: $profile"
              docker buildx bake --file generated/docker-bake.hcl "final-$profile" --load $NO_CACHE_FLAG
              echo "$profile" >> profiles-built.txt
            done
          fi

      - name: Run post-install contract checks
        env:
          # Armed on every trigger: workflow_run and pull_request carry no
          # event.inputs, so the fallback ('true') arms them. A dispatch
          # selecting 'false' still disables the step -- 'false' is a
          # non-empty string, truthy under GitHub expression semantics, so
          # it survives the || and the manual escape hatch is preserved.
          RUN_POSTINSTALL_CHECKS: ${{ github.event.inputs['run-postinstall-checks'] || 'true' }}
        run: |
          set -uo pipefail
          if [ "$RUN_POSTINSTALL_CHECKS" != 'true' ]; then
            echo "Post-install contract checks disabled"
            exit 0
          fi

          failed=0
          while read -r profile; do
            [ -n "$profile" ] || continue
            tag=$(sed -n "/^target \"final-$profile\" /,/^}/p" generated/docker-bake.hcl \
              | awk '/tags = \[/{flag=1; next} flag && /\]/{exit} flag {gsub(/[",]/, ""); gsub(/^[ \t]+|[ \t]+$/, ""); if ($0 != "") {print; exit}}')
            if [ -z "$tag" ]; then
              echo "No tag found in bake file for $profile; skipping post-install checks" >&2
              continue
            fi
            echo "Running post-install contract checks for $tag"
            docker run --rm --entrypoint /opt/solen/run-postinstall-checks.sh "$tag" || failed=1
          done < profiles-built.txt

          exit "$failed"

      - name: Generate SBOM and Trivy scans
        run: |
          set -uo pipefail
          while read -r profile; do
            [ -n "$profile" ] || continue
            tag=$(sed -n "/^target \"final-$profile\" /,/^}/p" generated/docker-bake.hcl \
              | awk '/tags = \[/{flag=1; next} flag && /\]/{exit} flag {gsub(/[",]/, ""); gsub(/^[ \t]+|[ \t]+$/, ""); if ($0 != "") {print; exit}}')
            if [ -z "$tag" ]; then
              echo "No tag found in bake file for $profile; skipping scans" >&2
              continue
            fi
            echo "Scanning $tag"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              anchore/syft:latest "$tag" -o json > "sbom-$profile.json" || echo "WARN: syft failed for $profile" >&2
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasecurity/trivy:latest image --format json --output "trivy-$profile.json" "$tag" \
              || echo "WARN: trivy failed for $profile" >&2
          done < profiles-built.txt

      - name: Upload built profiles list
        uses: actions/upload-artifact@v7
        with:
          name: profiles-built
          path: profiles-built.txt

      - name: Upload SBOMs and scans
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom-and-scans
          path: |
            sbom-*.json
            trivy-*.json
