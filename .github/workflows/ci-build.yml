name: CI Build & SBOM

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      profiles:
        description: 'Comma-separated list of profiles to build (defaults to data-science)'
        required: false
        default: 'data-science'
      no-cache:
        description: 'Disable buildx cache'
        required: false
        default: 'false'

permissions:
  contents: read

env:
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}
  IMAGE_NAME: ${{ github.event.repository.name }}

jobs:
  build:
    # In-cluster ARC runner (actions-runner-controller) with a privileged
    # docker:dind sidecar, so buildx works exactly as in a plain docker env.
    runs-on: ebpro-org
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install solen-cli
        run: |
          python -m pip install --upgrade pip
          pip install -e solen-cli

      - name: Generate profiles
        run: solen generate profiles --matrix profiles/matrix --out generated/profiles --chain

      - name: Generate Dockerfile and bake file
        run: |
          solen generate dockerfile --all --output generated/Dockerfile
          solen generate bake --output generated/docker-bake.hcl

      - name: Build profiles (single-arch, loaded into local daemon)
        id: build
        env:
          PROFILE_LIST: ${{ github.event.inputs.profiles || 'data-science' }}
          NO_CACHE: ${{ github.event.inputs['no-cache'] || 'false' }}
        run: |
          set -euo pipefail
          NO_CACHE_FLAG=""
          if [ "$NO_CACHE" = 'true' ]; then
            NO_CACHE_FLAG="--set *.no-cache=true"
          fi
          IFS=',' read -r -a arr <<< "$PROFILE_LIST"
          : > profiles-built.txt
          for profile in "${arr[@]}"; do
            profile=$(echo "$profile" | xargs)
            echo "Building profile: $profile"
            docker buildx bake --file generated/docker-bake.hcl "final-$profile" --load $NO_CACHE_FLAG
            echo "$profile" >> profiles-built.txt
          done

      - name: Generate SBOM and Trivy scans
        run: |
          set -uo pipefail
          while read -r profile; do
            [ -n "$profile" ] || continue
            tag=$(sed -n "/^target \"final-$profile\" /,/^}/p" generated/docker-bake.hcl \
              | sed -n '/tags = \[/,/\]/p' | grep -m1 '"' | tr -d '"')
            if [ -z "$tag" ]; then
              echo "No tag found in bake file for $profile; skipping scans" >&2
              continue
            fi
            echo "Scanning $tag"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              anchore/syft:latest "$tag" -o json > "sbom-$profile.json" || echo "WARN: syft failed for $profile" >&2
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasecurity/trivy:latest image --format json --output "trivy-$profile.json" "$tag" \
              || echo "WARN: trivy failed for $profile" >&2
          done < profiles-built.txt

      - name: Upload built profiles list
        uses: actions/upload-artifact@v4
        with:
          name: profiles-built
          path: profiles-built.txt

      - name: Upload SBOMs and scans
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-and-scans
          path: |
            sbom-*.json
            trivy-*.json
