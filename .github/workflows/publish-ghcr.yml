name: Publish to GHCR

on:
  push:
    branches: [ main ]
    tags: ['v*', 'release-*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Dockerfile and bake HCL
        run: |
          bash ./scripts/generate-dockerfile.sh --all-profiles --out Dockerfile.generated
          BAKE_PLATFORMS=linux/amd64,linux/arm64 BAKE_ARCHS=amd64,arm64 ./scripts/generate-bake.sh

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile.generated
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/ebpro/solen:latest
            ghcr.io/ebpro/solen:${{ github.sha }}
