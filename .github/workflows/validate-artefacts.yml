name: Validate Artefacts

on:
  push:
    paths:
      - 'artefacts/**'
      - 'scripts/validate-artefacts.sh'
  pull_request:
    paths:
      - 'artefacts/**'
      - 'scripts/validate-artefacts.sh'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Run artefacts validator
        run: |
          chmod +x scripts/validate-artefacts.sh
          scripts/validate-artefacts.sh artefacts
