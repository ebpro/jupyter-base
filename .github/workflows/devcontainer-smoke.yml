name: Devcontainer smoke build

on:
  push:
    branches: ["feature/minimal", "main"]
  pull_request:
    branches: ["*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build Quarto dev image
        run: |
          docker build --progress=plain -f .devcontainer/Dockerfile -t jupyter-base:quarto --build-arg QUARTO_VERSION=1.8.24 ..
      - name: Run Quarto smoke checks
        run: |
          docker run --rm jupyter-base:quarto sh -lc "quarto --version && quarto check install || true"
