mysql:
  image: mysql:${MYSQL_VERSION:-8.0}
  environment:
    MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
    MYSQL_DATABASE: ${DB_NAME:-notebook-db}
    MYSQL_USER: ${DB_USERNAME:-dba}
    MYSQL_PASSWORD: ${DB_PASSWORD:-secretsecret}
  volumes:
    - mysql-data:/var/lib/mysql
  networks:
    - notebooknet
  healthcheck:
    test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootsecret}"]
    interval: 10s
    timeout: 5s
    retries: 5
  ports:
    - "3306:3306"
