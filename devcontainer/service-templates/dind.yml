docker:
  image: docker:27-dind
  privileged: true
  restart: unless-stopped
  environment:
    DOCKER_TLS_CERTDIR: ""
  volumes:
    - docker-data:/var/lib/docker
  networks:
    - notebooknet
  healthcheck:
    test: ["CMD", "docker", "info"]
    interval: 5s
    timeout: 3s
    retries: 10
    start_period: 10s
