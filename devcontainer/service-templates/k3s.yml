k3s:
  image: rancher/k3s:${K3S_VERSION:-v1.31-latest}
  command: server
  privileged: true
  environment:
    K3S_KUBECONFIG_OUTPUT: /output/kubeconfig.yaml
    K3S_KUBECONFIG_MODE: "644"
    K3S_TOKEN: ${K3S_TOKEN:-mytoken}
  volumes:
    - k3s-server:/var/lib/rancher/k3s
    - k3s-kubeconfig:/output
  networks:
    - notebooknet
  tmpfs:
    - /run
    - /var/run
  ports:
    - "6443:6443"
    - "8080:8080"
  healthcheck:
    test: ["CMD", "k3s", "kubectl", "get", "nodes"]
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 60s
