buildkit:
  image: moby/buildkit:${BUILDKIT_VERSION:-latest}
  privileged: true
  environment:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  volumes:
    - buildkit-data:/var/lib/buildkit
  networks:
    - notebooknet
  ports:
    - "1234:1234"
  healthcheck:
    test: ["CMD", "buildctl", "debug", "workers"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 15s
