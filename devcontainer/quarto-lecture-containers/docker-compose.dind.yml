version: "3.8"

x-common-config: &common-config
  user: jovyan
  environment: &common-env
    DOCKER_HOST: tcp://docker:2375
    DB_USERNAME: ${DB_USERNAME:-dba}
    DB_PASSWORD: ${DB_PASSWORD:-secretsecret}
    DB_URL: ${DB_URL:-jdbc:postgresql://postgres/notebook-db}
  volumes: &common-volumes
    - ${PWD}:/home/jovyan/work/local:cached
    - jupyter-work:/home/jovyan/work/
  networks:
    - notebooknet
  depends_on:
    docker:
      condition: service_healthy

services:
  docker:
    image: docker:27-dind
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - docker-data:/var/lib/docker
    networks:
      - notebooknet
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  devcontainer:
    <<: *common-config
    image: ${IMAGE_REPO:-ghcr.io/ebpro}/${IMAGE_NAME:-solen}:${IMAGE_TAG:-quarto-lecture-containers-develop}
    environment:
      <<: *common-env
      GITHUBORG: ${GITHUBORG}
      GITHUB_PAT: ${GITHUB_PAT}
      GITHUBACTOR: ${GITHUBACTOR}
      GITHUBTOKEN: ${GITHUBTOKEN}
      DOCKERHUB_USERNAME: ${DOCKERHUB_USERNAME}
      DOCKERHUB_TOKEN: ${DOCKERHUB_TOKEN}
    command: sleep infinity
    volumes: *common-volumes

  notebook-builder:
    <<: *common-config
    image: ${IMAGE_REPO:-ghcr.io/ebpro}/${IMAGE_NAME:-solen}:${IMAGE_TAG:-quarto-lecture-containers-develop}
    environment:
      <<: *common-env
      GITHUBORG: ${GITHUBORG}
      GITHUB_PAT: ${GITHUB_PAT}
      GITHUBACTOR: ${GITHUBACTOR}
      GITHUBTOKEN: ${GITHUBTOKEN}
      DOCKERHUB_USERNAME: ${DOCKERHUB_USERNAME}
      DOCKERHUB_TOKEN: ${DOCKERHUB_TOKEN}
    working_dir: /home/jovyan/work/local/
    command: quarto-utils/_utils/build.sh ${ARGS:-}
    volumes: *common-volumes

volumes:
  docker-data:
  jupyter-work:

networks:
  notebooknet:
    driver: bridge
