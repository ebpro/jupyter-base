version: "3.8"

# Template for PostgreSQL service
# Copy this to /compose/<your-profile>/ and customize as needed

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-dba}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secretsecret}
      POSTGRES_DB: ${DB_NAME:-notebook-db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - devnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-dba}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  devcontainer:
    image: ${IMAGE_REPO}/${IMAGE_NAME}:${IMAGE_TAG}
    user: jovyan
    environment:
      DB_USERNAME: ${DB_USERNAME:-dba}
      DB_PASSWORD: ${DB_PASSWORD:-secretsecret}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-notebook-db}
      DB_URL: postgresql://${DB_USERNAME:-dba}:${DB_PASSWORD:-secretsecret}@postgres:5432/${DB_NAME:-notebook-db}
    volumes:
      - ${PWD}:/home/jovyan/work/local
    networks:
      - devnet
    depends_on:
      postgres:
        condition: service_healthy
    command: sleep infinity

volumes:
  postgres-data:

networks:
  devnet:
