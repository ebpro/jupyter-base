version: "3.8"

# Template for Docker-in-Docker (dind) + PostgreSQL
# This is the recommended setup for teaching environments
# Copy this to /compose/<your-profile>/ and customize as needed

services:
  devcontainer:
    image: ${IMAGE_REPO}/${IMAGE_NAME}:${IMAGE_TAG}
    user: jovyan
    working_dir: /home/jovyan/work/local
    environment:
      # Docker-in-Docker
      DOCKER_HOST: tcp://docker:2375
      # PostgreSQL
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${DB_USERNAME:-jovyan}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jovyan}
      POSTGRES_DB: ${DB_NAME:-demo}
      DB_URL: postgresql://${DB_USERNAME:-jovyan}:${DB_PASSWORD:-jovyan}@postgres:5432/${DB_NAME:-demo}
    volumes:
      - ${PWD}:/home/jovyan/work/local:cached
    networks:
      - devnet
    depends_on:
      docker:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: sleep infinity

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-jovyan}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jovyan}
      POSTGRES_DB: ${DB_NAME:-demo}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - devnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-jovyan}"]
      interval: 10s
      timeout: 5s
      retries: 5

  docker:
    image: docker:27-dind
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - docker-data:/var/lib/docker
    networks:
      - devnet
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
  docker-data:

networks:
  devnet:
    driver: bridge
