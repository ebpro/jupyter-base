version: "3.8"

# Template for Docker-in-Docker (dind) sidecar
# Copy this to /compose/<your-profile>/ and customize as needed

services:
  docker:
    image: docker:27-dind
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - docker-data:/var/lib/docker
    networks:
      - devnet
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  devcontainer:
    image: ${IMAGE_REPO}/${IMAGE_NAME}:${IMAGE_TAG}
    user: jovyan
    working_dir: /home/jovyan/work/local
    environment:
      DOCKER_HOST: tcp://docker:2375
    volumes:
      - ${PWD}:/home/jovyan/work/local:cached
    networks:
      - devnet
    depends_on:
      docker:
        condition: service_healthy
    command: sleep infinity

volumes:
  docker-data:

networks:
  devnet:
    driver: bridge
