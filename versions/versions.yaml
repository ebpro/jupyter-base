## Example versions manifest (solen)
## Central source of truth for tool versions and optional source metadata

base:
  variant: ubuntu-24.04

tools:
  buildx:
    version: "v0.30.1"
    sources:
      - type: github
        repo: "docker/buildx"
  compose:
    version: "v5.0.1"
    sources:
      - type: github
        repo: "docker/compose"
  docker:
    version: "27-cli"
    sources:
      - type: github
        repo: "docker/cli"
  quarto:
    version: "v1.10.18"
    sources:
      - type: github
        repo: "quarto-dev/quarto-cli"
  node:
    version: "22.12.0"
    sources:
      - type: github
        repo: "nodejs/node"
  docker-ce:
    version: "27.5.1"
    sources:
      - type: github
        repo: "moby/moby"
  gitstatus:
    version: "1.5.4"
    # best-guess upstream: verify this repo; otherwise provide per-feature hook
    sources:
      - type: github
        repo: "romkatv/gitstatus"
  helm:
    version: "v4.0.4"
    sources:
      - type: github
        repo: "helm/helm"
  k9s:
    version: "v0.50.18"
    sources:
      - type: github
        repo: "derailed/k9s"
  k3d:
    version: "v5.8.3"
    sources:
      - type: github
        repo: "rancher/k3d"
  kubectl:
    version: "1.34.1"
    sources:
      - type: github
        repo: "kubernetes/kubernetes"
  kustomize:
    version: "v5.7.1"
    # Held at 5.7.1 by explicit decision: the upstream 5.8.0 release body
    # declares a namespace-propagation regression (kubernetes-sigs/kustomize#6031).
    # The 5.7.1 digests already in checksums.json are what enforcement uses.
    sources:
      - type: github
        repo: "kubernetes-sigs/kustomize"
  code-server:
    version: "v4.108.0"
    sources:
      - type: github
        repo: "coder/code-server"
  minikube:
    version: "1.37.0"
    sources:
      - type: github
        repo: "kubernetes/minikube"
  gh:
    version: "2.83.2"
    sources:
      - type: github
        repo: "cli/cli"
  hadolint:
    version: "2.12.0"
    sources:
      - type: github
        repo: "hadolint/hadolint"
  ctop:
    version: "0.7.7"
    sources:
      - type: github
        repo: "bcicen/ctop"
  dive:
    version: "0.12.0"
    sources:
      - type: github
        repo: "wagoodman/dive"
  gradle:
    version: "9.8.1"
    # java-gradle installs this pin through download_direct (checksums.json
    # tools.gradle, single arch-independent -bin.zip served for BOTH arches);
    # never an SDKMAN candidate resolution.
    sources:
      - type: github
        repo: "gradle/gradle-distributions"
  sdkman-cli:
    version: "5.23.2"
    # java-sdkman bootstraps SDKMAN from this pin through download_direct
    # (checksums.json tools.sdkman-cli, SINGLE arch-independent release zip
    # served for BOTH arches); never by piping the upstream bootstrap script,
    # whose own build-time egress killed CI legs on curl (35). The archive
    # carries only bin/ src/ contrib/ — the etc/ and var/ state is synthesised
    # by the feature.
    sources:
      - type: github
        repo: "sdkman/sdkman-cli"
  jdk:
    version: "25.0.4.1+1"
    # Temurin JDK pin for the toolcache mirror matrix (checksums.json
    # tools.jdk: per-arch tar.gz — amd64 -> x64 asset, arm64 -> aarch64 asset;
    # the '+' is %2B-encoded in the release tag).
    sources:
      - type: github
        repo: "adoptium/temurin25-binaries"
  starship:
    version: "1.27.0"
    # zsh-config installs this pin through download_direct (checksums.json
    # tools.starship, both arches); never upstream "latest".
    sources:
      - type: github
        repo: "starship/starship"
  tinytex:
    version: "2026.09"
    sources:
      - type: github
        repo: "yihui/tinytex"
  java-kernel:
    version: "1.4.6-pr12"
    sources:
      - type: github
        repo: "ebpro/IJava"
  tilt:
    version: "v0.36.0"
    sources:
      - type: github
        repo: "tilt-dev/tilt"
  miniforge:
    version: "25.11.0-1"
    sources:
      - type: github
        repo: "conda-forge/miniforge"
  mongodb:
    version: "8.0"
    sources:
      - type: github
        repo: "mongodb/mongo"
  postgresql:
    version: "17"
    # upstream releases tracked on https://www.postgresql.org/ -- prefer per-feature hook (non-github)
  typescript:
    version: "5.7.2"
    sources:
      - type: github
        repo: "microsoft/TypeScript"
  chrome-headless-shell:
    version: "155.0.8059.39"

images:
  node:
    ref: "node:22.12.0"
  ubuntu:
    ref: "ubuntu:24.04"
